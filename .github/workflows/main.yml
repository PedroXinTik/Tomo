name: Agente V8 - Base Futurista

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/gerar_apk_agente_v8.yml"

permissions:
  contents: read

concurrency:
  group: agente-v8-build
  cancel-in-progress: true

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp

          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

          /tmp/gradle-8.9/bin/gradle --version

      - name: Criar estrutura Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/agente/v8 \
            app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AgenteV8"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          org.gradle.parallel=false
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.agente.v8'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.agente.v8'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="Agente V8"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#8B5CF6</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080B18</item>
                  <item name="android:navigationBarColor">#080B18</item>
                  <item name="android:windowBackground">#080B18</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/agente/v8/MainActivity.kt <<'EOF'
          package com.agente.v8

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.content.SharedPreferences
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.content.Context
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.concurrent.thread

          class MainActivity : Activity() {

              private val bg = Color.rgb(8, 11, 24)
              private val panelColor = Color.rgb(18, 24, 45)
              private val blue = Color.rgb(55, 150, 255)
              private val purple = Color.rgb(151, 91, 255)
              private val white = Color.rgb(240, 243, 255)
              private val muted = Color.rgb(157, 169, 198)

              private lateinit var prefs: SharedPreferences
              private lateinit var chat: LinearLayout
              private lateinit var input: EditText
              private lateinit var status: TextView
              private lateinit var memoryStatus: TextView
              private lateinit var scroll: ScrollView

              private var tts: TextToSpeech? = null

              private val voiceRequest = 804

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  prefs = getSharedPreferences("agente_v8", MODE_PRIVATE)

                  tts = TextToSpeech(this) { result ->
                      if (result == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("pt", "BR")
                      }
                  }

                  buildInterface()
                  refreshMemory()

                  addMessage(
                      "Agente V8",
                      "Olá, amigão! Sou sua base de assistente de programação. " +
                      "Você pode pedir códigos, guardar conhecimentos e consultar " +
                      "minha memória. Configure sua API para conversar com a IA."
                  )
              }

              private fun buildInterface() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(bg)
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(20), dp(18), dp(20), dp(12))
                  }

                  val brand = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  brand.addView(label("AGENTE V8", 23f, white, true))
                  brand.addView(label("ASSISTENTE INTELIGENTE", 10f, muted, false))

                  header.addView(
                      brand,
                      LinearLayout.LayoutParams(0, -2, 1f)
                  )

                  val settings = pill("⚙ API", purple) {
                      configureApi()
                  }

                  header.addView(settings)
                  root.addView(header)

                  val hero = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(8), dp(12), dp(14))
                  }

                  val orb = TextView(this).apply {
                      text = "V8"
                      textSize = 34f
                      setTextColor(white)
                      gravity = Gravity.CENTER
                      typeface = Typeface.DEFAULT_BOLD
                      background = shape(
                          intArrayOf(
                              Color.rgb(40, 98, 210),
                              Color.rgb(115, 54, 210)
                          ),
                          100
                      )
                  }

                  hero.addView(
                      orb,
                      LinearLayout.LayoutParams(dp(94), dp(94))
                  )

                  hero.addView(
                      label(
                          "SUA IDEIA. NOSSO PRÓXIMO PASSO.",
                          12f,
                          muted,
                          true
                      ).apply {
                          gravity = Gravity.CENTER
                          setPadding(0, dp(12), 0, dp(4))
                      }
                  )

                  status = label("● SISTEMA PRONTO", 12f, blue, true)
                  status.gravity = Gravity.CENTER
                  hero.addView(status)

                  root.addView(hero)

                  val memoryCard = card()

                  memoryCard.addView(label("🧠  MEMÓRIA DO AGENTE", 15f, white, true))

                  memoryStatus = label(
                      "Conhecimentos salvos: 0",
                      12f,
                      muted,
                      false
                  )

                  memoryCard.addView(
                      memoryStatus,
                      marginParams(top = 8)
                  )

                  memoryCard.addView(
                      pill("Ensinar conhecimento", purple) {
                          teachKnowledge()
                      },
                      marginParams(top = 12)
                  )

                  memoryCard.addView(
                      pill("Consultar memória", blue) {
                          showMemory()
                      },
                      marginParams(top = 8)
                  )

                  root.addView(
                      memoryCard,
                      marginParams(
                          horizontal = 16,
                          bottom = 10
                      )
                  )

                  val chatCard = card()

                  chatCard.addView(
                      label("💬  CENTRAL DE COMANDO", 15f, white, true)
                  )

                  scroll = ScrollView(this).apply {
                      isFillViewport = false
                      overScrollMode = View.OVER_SCROLL_IF_CONTENT_SCROLLS
                  }

                  chat = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(2), dp(8), dp(2), dp(8))
                  }

                  scroll.addView(chat)

                  chatCard.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(180)
                      )
                  )

                  root.addView(
                      chatCard,
                      marginParams(
                          horizontal = 16,
                          bottom = 8
                      )
                  )

                  input = EditText(this).apply {
                      hint = "Peça um código ou faça uma pergunta..."
                      hintTextColor = muted
                      setTextColor(white)
                      textSize = 14f
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      background = shape(
                          intArrayOf(panelColor, panelColor),
                          24
                      )
                      minHeight = dp(52)
                  }

                  root.addView(
                      input,
                      marginParams(horizontal = 16, bottom = 8)
                  )

                  val controls = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(2), dp(12), dp(14))
                  }

                  controls.addView(
                      pill("🎙 Voz", purple) {
                          startVoice()
                      },
                      LinearLayout.LayoutParams(0, dp(48), 1f).apply {
                          setMargins(dp(4), 0, dp(4), 0)
                      }
                  )

                  controls.addView(
                      pill("Enviar ➤", blue) {
                          sendMessage()
                      },
                      LinearLayout.LayoutParams(0, dp(48), 1f).apply {
                          setMargins(dp(4), 0, dp(4), 0)
                      }
                  )

                  root.addView(controls)

                  setContentView(root)
              }

              private fun card(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      background = shape(
                          intArrayOf(panelColor, panelColor),
                          24
                      )
                  }
              }

              private fun label(
                  textValue: String,
                  size: Float,
                  color: Int,
                  bold: Boolean
              ): TextView {
                  return TextView(this).apply {
                      text = textValue
                      textSize = size
                      setTextColor(color)
                      if (bold) typeface = Typeface.DEFAULT_BOLD
                  }
              }

              private fun pill(
                  textValue: String,
                  accent: Int,
                  action: () -> Unit
              ): Button {
                  return Button(this).apply {
                      text = textValue
                      textSize = 12f
                      isAllCaps = false
                      setTextColor(white)
                      background = shape(
                          intArrayOf(accent, accent),
                          60
                      )
                      setPadding(dp(12), 0, dp(12), 0)
                      minHeight = dp(44)
                      stateListAnimator = null
                      setOnClickListener { action() }
                  }
              }

              private fun shape(
                  colors: IntArray,
                  radius: Int
              ): GradientDrawable {
                  return GradientDrawable(
                      if (colors.size > 1) {
                          GradientDrawable.Orientation.TL_BR
                      } else {
                          GradientDrawable.Orientation.LEFT_RIGHT
                      },
                      colors
                  ).apply {
                      cornerRadius = dp(radius).toFloat()
                  }
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              private fun marginParams(
                  horizontal: Int = 0,
                  top: Int = 0,
                  bottom: Int = 0
              ): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply {
                      setMargins(
                          dp(horizontal),
                          dp(top),
                          dp(horizontal),
                          dp(bottom)
                      )
                  }
              }

              private fun addMessage(
                  speaker: String,
                  message: String
              ) {
                  val item = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      background = shape(
                          intArrayOf(
                              if (speaker == "Você") {
                                  Color.rgb(30, 42, 75)
                              } else {
                                  Color.rgb(28, 30, 58)
                              },
                              if (speaker == "Você") {
                                  Color.rgb(30, 42, 75)
                              } else {
                                  Color.rgb(28, 30, 58)
                              }
                          ),
                          20
                      )
                  }

                  item.addView(
                      label(
                          speaker,
                          11f,
                          if (speaker == "Você") blue else purple,
                          true
                      )
                  )

                  item.addView(
                      label(message, 13f, white, false).apply {
                          setPadding(0, dp(5), 0, 0)
                      }
                  )

                  chat.addView(
                      item,
                      marginParams(bottom = 8)
                  )

                  scroll.post {
                      scroll.fullScroll(View.FOCUS_DOWN)
                  }
              }

              private fun sendMessage() {
                  val prompt = input.text.toString().trim()

                  if (prompt.isEmpty()) {
                      Toast.makeText(
                          this,
                          "Digite seu pedido primeiro.",
                          Toast.LENGTH_SHORT
                      ).show()
                      return
                  }

                  input.setText("")

                  val imm = getSystemService(
                      Context.INPUT_METHOD_SERVICE
                  ) as InputMethodManager

                  imm.hideSoftInputFromWindow(input.windowToken, 0)

                  addMessage("Você", prompt)

                  val apiKey = prefs.getString("api_key", "").orEmpty()

                  if (apiKey.isBlank()) {
                      addMessage(
                          "Agente V8",
                          "Seu pedido foi recebido. Para obter respostas " +
                          "geradas pela IA, toque em ⚙ API e configure sua " +
                          "chave. A memória local funciona sem essa conexão."
                      )
                      status.text = "● AGUARDANDO CONFIGURAÇÃO DA IA"
                      return
                  }

                  status.text = "● PENSANDO..."

                  thread {
                      try {
                          val answer = askGemini(apiKey, prompt)

                          runOnUiThread {
                              addMessage("Agente V8", answer)
                              status.text = "● RESPOSTA RECEBIDA"

                              prefs.edit()
                                  .putString("last_prompt", prompt)
                                  .putString("last_answer", answer)
                                  .apply()
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              addMessage(
                                  "Agente V8",
                                  "Não consegui obter a resposta. " +
                                  "Verifique a conexão, a chave da API " +
                                  "e a configuração do serviço. " +
                                  "Detalhe: ${e.message ?: "erro de rede"}"
                              )

                              status.text = "● FALHA NA CONEXÃO"
                          }
                      }
                  }
              }

              private fun askGemini(
                  apiKey: String,
                  prompt: String
              ): String {
                  val url = URL(
                      "https://generativelanguage.googleapis.com/" +
                      "v1beta/models/gemini-2.5-flash:generateContent"
                  )

                  val history = prefs.getString("knowledge", "[]")
                      .orEmpty()

                  val body = JSONObject().apply {
                      put(
                          "systemInstruction",
                          JSONObject().put(
                              "parts",
                              JSONArray().put(
                                  JSONObject().put(
                                      "text",
                                      "Você é o Agente V8, assistente de " +
                                      "programação em português brasileiro. " +
                                      "Ajude a criar, revisar e corrigir códigos. " +
                                      "Considere os conhecimentos fornecidos " +
                                      "pelo usuário, armazenados localmente: " +
                                      history.take(12000) +
                                      ". Não afirme que executou ou testou " +
                                      "um código sem evidências. Explique " +
                                      "quando uma tarefa exigir ferramentas " +
                                      "externas."
                                  )
                              )
                          )
                      )

                      put(
                          "contents",
                          JSONArray().put(
                              JSONObject().apply {
                                  put("role", "user")
                                  put(
                                      "parts",
                                      JSONArray().put(
                                          JSONObject().put("text", prompt)
                                      )
                                  )
                              }
                          )
                      )
                  }

                  val connection = url.openConnection()
                      as HttpURLConnection

                  try {
                      connection.requestMethod = "POST"
                      connection.connectTimeout = 20000
                      connection.readTimeout = 45000
                      connection.doOutput = true

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=UTF-8"
                      )

                      connection.setRequestProperty(
                          "x-goog-api-key",
                          apiKey
                      )

                      connection.outputStream.use {
                          it.write(body.toString().toByteArray(Charsets.UTF_8))
                      }

                      val code = connection.responseCode

                      val stream = if (code in 200..299) {
                          connection.inputStream
                      } else {
                          connection.errorStream
                      }

                      val response = stream.bufferedReader().use {
                          it.readText()
                      }

                      if (code !in 200..299) {
                          throw Exception(
                              "HTTP $code: ${response.take(500)}"
                          )
                      }

                      val json = JSONObject(response)

                      val candidates = json.optJSONArray("candidates")
                          ?: throw Exception("A IA não retornou candidatos.")

                      val content = candidates
                          .optJSONObject(0)
                          ?.optJSONObject("content")
                          ?: throw Exception("Resposta vazia da IA.")

                      val parts = content.optJSONArray("parts")
                          ?: throw Exception("Resposta sem texto.")

                      val result = StringBuilder()

                      for (i in 0 until parts.length()) {
                          result.append(
                              parts.optJSONObject(i)?.optString("text", "")
                          )
                      }

                      result.toString().trim().ifBlank {
                          "A IA retornou uma resposta vazia."
                      }
                  } finally {
                      connection.disconnect()
                  }
              }

              private fun configureApi() {
                  val field = EditText(this).apply {
                      hint = "Cole sua chave da API"
                      setSingleLine(true)
                      inputType = 129
                      setText(
                          prefs.getString("api_key", "").orEmpty()
                      )
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Conectar inteligência artificial")
                      .setMessage(
                          "Informe uma chave da API Gemini. " +
                          "A chave será armazenada localmente no aplicativo. " +
                          "Não compartilhe seu APK com a chave configurada."
                      )
                      .setView(field)
                      .setNegativeButton("Cancelar", null)
                      .setPositiveButton("Salvar") { _, _ ->
                          val key = field.text.toString().trim()

                          prefs.edit()
                              .putString("api_key", key)
                              .apply()

                          Toast.makeText(
                              this,
                              "Configuração salva.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      .show()
              }

              private fun teachKnowledge() {
                  val field = EditText(this).apply {
                      hint = "Escreva o conhecimento que deseja guardar"
                      minLines = 3
                      gravity = Gravity.TOP
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Ensinar ao Agente V8")
                      .setMessage(
                          "O conhecimento será guardado na memória local " +
                          "e poderá ser utilizado nas próximas consultas."
                      )
                      .setView(field)
                      .setNegativeButton("Cancelar", null)
                      .setPositiveButton("Guardar") { _, _ ->
                          val knowledge = field.text.toString().trim()

                          if (knowledge.isNotEmpty()) {
                              val entries = readKnowledge()
                              entries.put(
                                  JSONObject().apply {
                                      put("text", knowledge)
                                      put("time", System.currentTimeMillis())
                                  }
                              )

                              prefs.edit()
                                  .putString("knowledge", entries.toString())
                                  .apply()

                              refreshMemory()

                              addMessage(
                                  "Agente V8",
                                  "Conhecimento guardado na memória local."
                              )
                          }
                      }
                      .show()
              }

              private fun readKnowledge(): JSONArray {
                  return try {
                      JSONArray(
                          prefs.getString("knowledge", "[]")
                      )
                  } catch (_: Exception) {
                      JSONArray()
                  }
              }

              private fun refreshMemory() {
                  val count = readKnowledge().length()

                  memoryStatus.text =
                      "Conhecimentos salvos: $count"
              }

              private fun showMemory() {
                  val entries = readKnowledge()
                  val text = StringBuilder()

                  for (i in 0 until entries.length()) {
                      val item = entries.optJSONObject(i)
                      text.append("• ")
                          .append(item?.optString("text", ""))
                          .append("\n\n")
                  }

                  if (text.isEmpty()) {
                      text.append(
                          "Sua memória está vazia. " +
                          "Use o botão Ensinar conhecimento."
                      )
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Memória do Agente V8")
                      .setMessage(text.toString())
                      .setPositiveButton("Fechar", null)
                      .setNeutralButton("Apagar memória") { _, _ ->
                          AlertDialog.Builder(this)
                              .setTitle("Apagar conhecimentos?")
                              .setMessage(
                                  "Esta ação remove os conhecimentos " +
                                  "guardados localmente."
                              )
                              .setNegativeButton("Cancelar", null)
                              .setPositiveButton("Apagar") { _, _ ->
                                  prefs.edit()
                                      .putString("knowledge", "[]")
                                      .apply()

                                  refreshMemory()
                              }
                              .show()
                      }
                      .show()
              }

              private fun startVoice() {
                  try {
                      val intent = Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                      ).apply {
                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                          )

                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE,
                              "pt-BR"
                          )

                          putExtra(
                              RecognizerIntent.EXTRA_PROMPT,
                              "Fale seu pedido para o Agente V8"
                          )
                      }

                      startActivityForResult(intent, voiceRequest)
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "O reconhecimento de voz não está disponível.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              @Deprecated("API de retorno de reconhecimento de voz")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == voiceRequest &&
                      resultCode == RESULT_OK
                  ) {
                      val results = data?.getStringArrayListExtra(
                          RecognizerIntent.EXTRA_RESULTS
                      )

                      val spoken = results?.firstOrNull()

                      if (!spoken.isNullOrBlank()) {
                          input.setText(spoken)
                          input.setSelection(input.text.length)
                          sendMessage()
                      }
                  }
              }

              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF

      - name: Validar estrutura do projeto
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/agente/v8/MainActivity.kt

          echo "Arquivos principais encontrados."

      - name: Compilar APK de depuracao
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK nao encontrado ou arquivo vazio."
            exit 1
          fi

          ls -lh "$APK"

          echo "APK gerado com sucesso."

      - name: Disponibilizar APK para download
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Agente-V8-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
