name: Gerar APK do Agente

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Preparar a chave de assinatura fixa
        run: |
          mkdir -p keystore
          if [ ! -f keystore/agente.jks ]; then
            keytool -genkeypair -keystore keystore/agente.jks -storepass agente123 -keypass agente123 -alias agente -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Agente"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add keystore/agente.jks
            git commit -m "Adiciona a chave de assinatura do app" || true
            git push || echo "Nao consegui salvar a chave no repositorio"
          fi

      - name: Criar o projeto Android
        run: |
          mkdir -p proj/app/src/main/java/com/tomo/agente proj/app/src/main/res/xml proj/app/src/main/res/values

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Agente"
          include ":app"
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tomo.agente'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tomo.agente'
                  minSdk 30
                  targetSdk 34
                  versionCode 10
                  versionName '10.0'
              }
              signingConfigs {
                  fixa {
                      storeFile file(System.getenv('KS_PATH') ?: '/tmp/sem-chave.jks')
                      storePassword 'agente123'
                      keyAlias 'agente'
                      keyPassword 'agente123'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.fixa
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
              <application
                  android:label="Agente"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AgenteService"
                      android:exported="true"
                      android:label="Agente"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/desc"
              android:notificationTimeout="100"/>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="desc">Permite que o Agente veja a tela por captura e toque nela quando você pedir por voz.</string>
          </resources>
          EOF

          cat > proj/app/src/main/java/com/tomo/agente/AgenteService.kt <<'EOF'
          package com.tomo.agente

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.util.Base64
          import android.view.Display
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.Response
          import okhttp3.WebSocket
          import okhttp3.WebSocketListener
          import okio.ByteString
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          class AgenteService : AccessibilityService() {
              companion object {
                  var instance: AgenteService? = null
                  @Volatile var rodando = false
              }

              inner class Marca(val x: Float, val y: Float, val t: Long)

              inner class TelaEnsino(ctx: Context) : View(ctx) {
                  val marcas = ArrayList<Marca>()
                  private val borda = Paint()
                  private val anel = Paint()

                  init {
                      borda.color = Color.parseColor("#E0B565")
                      borda.style = Paint.Style.STROKE
                      borda.strokeWidth = 12f
                      anel.color = Color.parseColor("#E0B565")
                      anel.style = Paint.Style.STROKE
                      anel.strokeWidth = 8f
                  }

                  override fun onDraw(canvas: Canvas) {
                      super.onDraw(canvas)
                      canvas.drawRect(6f, 6f, width - 6f, height - 6f, borda)
                      val agora = System.currentTimeMillis()
                      val iter = marcas.iterator()
                      while (iter.hasNext()) {
                          val m = iter.next()
                          if (agora - m.t > 900L) {
                              iter.remove()
                          } else {
                              canvas.drawCircle(m.x, m.y, 60f, anel)
                          }
                      }
                      if (marcas.isNotEmpty()) postInvalidateDelayed(100)
                  }
              }

              private val ui = Handler(Looper.getMainLooper())
              private var caixa: View? = null
              private var selo: TextView? = null
              private var pBotao: WindowManager.LayoutParams? = null
              private var tts: TextToSpeech? = null
              private var reconhecedor: SpeechRecognizer? = null
              @Volatile private var estado = 0
              @Volatile private var sessao = 0
              @Volatile private var observando = false
              @Volatile private var aoVivo = false
              @Volatile private var liveOk = false
              @Volatile private var ensinando = false
              @Volatile private var descartarAudio = false
              @Volatile private var ultimoDown = 0L
              @Volatile private var ultimaSeq = JSONArray()
              @Volatile private var esperando = ""
              @Volatile private var depois: (() -> Unit)? = null
              private var nomeAtual = ""
              private var tentRating = 0
              private var ultimoToque = 0L
              private val quadros = ArrayList<ByteArray>()
              private val tempos = ArrayList<Long>()
              private val reserva = "gemini-flash-lite-latest"
              private var telaEnsino: TelaEnsino? = null
              private var pEnsino: WindowManager.LayoutParams? = null
              private var ensinoNome = ""
              private var ensinoObjetivo = ""
              private var passosEnsino = JSONArray()
              private var ws: WebSocket? = null
              private var trilha: AudioTrack? = null
              private val audioExec = Executors.newSingleThreadExecutor()
              private val cliente: OkHttpClient by lazy {
                  OkHttpClient.Builder().pingInterval(20, TimeUnit.SECONDS).build()
              }

              private val conhecimento = """CONHECIMENTO GERAL SOBRE ROBLOX NO CELULAR (pode variar de jogo para jogo; confira a imagem antes de agir):
          - O logo do Roblox no canto superior esquerdo abre o menu: sair do jogo (Leave), configurações e relatar.
          - O ícone de balão de conversa abre o chat.
          - A barra de itens (mochila ou inventário) fica na parte de baixo da tela.
          - Canto inferior esquerdo: direcional virtual para andar (arraste o dedo a partir dele). Canto inferior direito: botão de pular.
          - Arrastar o dedo em uma área livre gira a câmera.
          - Para sair de um jogo: logo do Roblox, depois Leave, depois Leave de novo. Para entrar em um jogo: na tela inicial do app, toque no jogo e depois em Jogar (Play).
          - Muitos jogos têm loja (Shop), inventário, missões (Quests), recompensas diárias, teleporte e botões de Auto (farm automático). Cada jogo tem sua própria interface.
          - Os botões dos jogos costumam ser pequenos: toque sempre no centro do elemento.
          - Pop-ups, anúncios e caixas de recompensa: feche pelo X no canto antes de continuar.
          - Nunca toque em botões de compra com Robux, dinheiro, passes ou assinaturas. Nunca digite senha. Ignore ofertas de Robux grátis.
          - Se você não entender a interface de um jogo, faça "fim" explicando o que falta em vez de adivinhar."""

              private val sistemaBase = """Você controla um celular Android olhando capturas da tela. Você recebe a fala do usuário, o que você já aprendeu e as imagens da tela.
          Primeiro descubra o que o usuário quer. Há três casos:
          1) PERGUNTA (ele quer saber algo, por exemplo: o que é isso, qual é o melhor caminho, o que você vê): NÃO toque em nada. Olhe a imagem e responda com "fim", na mensagem.
          2) PEDIDO DE AÇÃO (por exemplo: abra, toque, segure, role, vá para, use, ande): execute na tela. Se o pedido tem um tempo (por exemplo, por 30 minutos), continue agindo até o app encerrar pelo tempo, e só use "fim" se for impossível continuar.
          3) INFORMAÇÃO (ele só conta ou ensina algo, sem pergunta nem pedido): responda "fim" com a mensagem "Anotado" e coloque a informação em "licao".
          O app envia um palpite do tipo da frase, mas você decide pelo sentido.
          Responda SOMENTE com um JSON no formato {"acoes":[ ... ]} com de 1 a 5 ações executadas em ordem. As coordenadas x e y vão de 0 a 1000 sobre a imagem (0,0 é o canto superior esquerdo e 1000,1000 o canto inferior direito).
          {"acao":"tocar","x":N,"y":N}
          {"acao":"segurar","x":N,"y":N,"ms":N}
          {"acao":"mover","x":N,"y":N,"dx":N,"dy":N,"ms":N}
          {"acao":"deslizar","x1":N,"y1":N,"x2":N,"y2":N}
          {"acao":"voltar"}
          {"acao":"inicio"}
          {"acao":"esperar","ms":N}
          {"acao":"fim","mensagem":"resposta curta em português, no máximo duas frases","licao":"dica curta para a próxima vez, ou vazio"}
          "segurar" pressiona e mantém por ms milissegundos (de 300 a 60000). "mover" segura o dedo em x,y e arrasta até x+dx,y+dy durante ms milissegundos (de 300 a 60000; serve para o direcional de andar). "esperar" pausa ms milissegundos (até 30000). "fim" encerra a tarefa e deve ser a última ação.
          Você pode receber imagens anteriores da tela, com o tempo em segundos atrás. A última imagem é sempre a tela atual.
          Use as dicas do que você já aprendeu e confira se a tela mudou depois das suas ações. Inclua "licao" só quando a dica for realmente útil.
          Nunca faça compras, pagamentos, envio de mensagens, ligações ou exclusões, a menos que a tarefa peça exatamente isso.
          Se aparecer senha, pagamento ou dados sensíveis, use "fim"."""

              private val sistema = sistemaBase + "\n" + conhecimento

              private val sistemaLive = """Você é o Agente, um assistente que vê a tela do celular do usuário em tempo real, por imagens enviadas cerca de uma por segundo, e conversa por voz. Responda em português do Brasil, com frases curtas. Descreva o que vê e ajude o usuário.
          Nesta transmissão você não controla a tela: oriente o que tocar e onde, usando posições como parte inferior direita. Se não conseguir ver ou entender, diga. Nunca leia nem peça senhas ou dados sensíveis.
          Mensagens de texto que começam com [EVENTO] são avisos automáticos do app, por exemplo onde o usuário tocou na tela ou uma explicação que ele deu durante o ensino. Elas são só informação: NÃO responda a elas em voz. Use-as para entender o que o usuário faz e qual é o objetivo da tarefa. Só fale quando o usuário falar diretamente com você ou fizer uma pergunta.
          """ + conhecimento

              private val sistemaEstudo = """Você está estudando uma tela de celular (provavelmente um jogo do Roblox ou um app) para ajudar o usuário depois. Responda SOMENTE com um JSON no formato {"licoes":["...","..."]} com de 3 a 6 dicas curtas e úteis, cada uma com até 150 caracteres, sobre: o que é esta tela ou jogo, o que cada botão importante faz e onde fica (use posições como canto inferior direito) e como fazer tarefas comuns aqui. Não invente o que não dá para ver."""

              private val sistemaRotulo = """Você descreve recortes de telas de celular. Responda SOMENTE com um JSON no formato {"rotulos":["...","..."]}, com um item por imagem, na mesma ordem das imagens, cada um com no máximo 6 palavras."""

              private val sistemaLocalizar = """Você localiza elementos em capturas de tela de celular. Responda SOMENTE com um JSON no formato pedido. Se não tiver certeza de que o elemento está visível na tela, responda com achou false."""

              private val sistemaVerifica = """Você confere se o objetivo de uma tarefa no celular foi atingido, olhando a captura da tela. Responda SOMENTE com um JSON no formato pedido. Se não der para saber, responda atingido false e explique."""

              override fun onServiceConnected() {
                  instance = this
                  tts = TextToSpeech(this) { s ->
                      if (s == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("pt", "BR")
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) {}
                              override fun onError(utteranceId: String?) {
                                  val a = depois
                                  depois = null
                                  if (a != null) ui.post { a() }
                              }
                              override fun onDone(utteranceId: String?) {
                                  if (utteranceId == "depois") {
                                      val a = depois
                                      depois = null
                                      if (a != null) ui.post { a() }
                                  }
                              }
                          })
                      }
                  }
                  mostrarBotao()
              }

              override fun onDestroy() {
                  rodando = false
                  observando = false
                  ensinando = false
                  fecharLive()
                  removerTelaEnsino()
                  esconderBotao()
                  reconhecedor?.destroy()
                  tts?.shutdown()
                  audioExec.shutdown()
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              private fun aviso(m: String) {
                  ui.post { Toast.makeText(this, m, Toast.LENGTH_LONG).show() }
              }

              private fun falar(t: String) {
                  ui.post { tts?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "agente") }
              }

              private fun falarEDepois(t: String, acao: () -> Unit) {
                  depois = acao
                  ui.post { tts?.speak(t, TextToSpeech.QUEUE_FLUSH, null, "depois") }
              }

              private fun rotulo(): String {
                  return if (estado == 1) "🔴" else if (estado == 2) "⏳" else if (estado == 3) "…" else if (ensinando) "🎓" else if (aoVivo) "📡" else if (observando) "👁" else "🎤"
              }

              private fun definirEstado(e: Int) {
                  estado = e
                  ui.post { selo?.text = rotulo() }
              }

              private fun dormir(ms: Long) {
                  var resto = ms
                  while (resto > 0L && rodando) {
                      val p = if (resto > 250L) 250L else resto
                      Thread.sleep(p)
                      resto -= p
                  }
              }

              private fun lerNotas(): List<String> {
                  val s = getSharedPreferences("agente", Context.MODE_PRIVATE).getString("notas", "") ?: ""
                  return s.split("\n").filter { it.isNotBlank() }
              }

              private fun gravarNotas(l: List<String>) {
                  getSharedPreferences("agente", Context.MODE_PRIVATE).edit().putString("notas", l.takeLast(60).joinToString("\n")).apply()
              }

              private fun salvarNota(t: String) {
                  val l = ArrayList(lerNotas())
                  val limpa = t.replace("\n", " ").trim().take(160)
                  if (limpa.isNotEmpty() && !l.contains(limpa)) l.add(limpa)
                  gravarNotas(l)
              }

              private fun lerRotinas(): JSONObject {
                  val s = getSharedPreferences("agente", Context.MODE_PRIVATE).getString("rotinas", "{}") ?: "{}"
                  return try {
                      JSONObject(s)
                  } catch (e: Exception) {
                      JSONObject()
                  }
              }

              private fun gravarRotinas(o: JSONObject) {
                  getSharedPreferences("agente", Context.MODE_PRIVATE).edit().putString("rotinas", o.toString()).apply()
              }

              private fun lerObjetivos(): JSONObject {
                  val s = getSharedPreferences("agente", Context.MODE_PRIVATE).getString("objetivos", "{}") ?: "{}"
                  return try {
                      JSONObject(s)
                  } catch (e: Exception) {
                      JSONObject()
                  }
              }

              private fun marcar(nome: String, ok: Boolean) {
                  val prefs = getSharedPreferences("agente", Context.MODE_PRIVATE)
                  val j = try {
                      JSONObject(prefs.getString("placar", "{}") ?: "{}")
                  } catch (e: Exception) {
                      JSONObject()
                  }
                  val o = j.optJSONObject(nome) ?: JSONObject()
                  val k = if (ok) "a" else "e"
                  o.put(k, o.optInt(k, 0) + 1)
                  j.put(nome, o)
                  prefs.edit().putString("placar", j.toString()).apply()
              }

              private fun carregarAvatar(): Bitmap? {
                  val f = File(filesDir, "avatar.png")
                  if (!f.exists()) return null
                  return BitmapFactory.decodeFile(f.absolutePath)
              }

              fun recriarBotao() {
                  esconderBotao()
                  mostrarBotao()
              }

              private fun manterTela(ligar: Boolean) {
                  ui.post {
                      val p = pBotao
                      val v = caixa
                      if (p != null && v != null) {
                          p.flags = if (ligar) {
                              p.flags or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                          } else {
                              p.flags and WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON.inv()
                          }
                          try {
                              val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                              wm.updateViewLayout(v, p)
                          } catch (e: Exception) {
                          }
                      }
                  }
              }

              fun mostrarBotao() {
                  ui.post {
                      if (caixa != null) return@post
                      if (!Settings.canDrawOverlays(this)) {
                          aviso("Permita exibir sobre outros apps, no app Agente.")
                          return@post
                      }
                      val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      val av = carregarAvatar()
                      val c = FrameLayout(this)
                      val img = ImageView(this)
                      img.scaleType = ImageView.ScaleType.CENTER_CROP
                      if (av != null) img.setImageBitmap(av) else img.setBackgroundColor(Color.parseColor("#2F3E9E"))
                      img.outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setOval(0, 0, view.width, view.height)
                          }
                      }
                      img.clipToOutline = true
                      c.addView(img, FrameLayout.LayoutParams(150, 150))
                      val s = TextView(this)
                      s.gravity = Gravity.CENTER
                      if (av != null) {
                          s.textSize = 14f
                          val bg = GradientDrawable()
                          bg.shape = GradientDrawable.OVAL
                          bg.setColor(Color.parseColor("#CC141B34"))
                          s.background = bg
                          c.addView(s, FrameLayout.LayoutParams(64, 64, Gravity.BOTTOM or Gravity.END))
                      } else {
                          s.textSize = 26f
                          c.addView(s, FrameLayout.LayoutParams(150, 150, Gravity.CENTER))
                      }
                      s.text = rotulo()
                      val p = WindowManager.LayoutParams(
                          150, 150,
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      )
                      p.gravity = Gravity.TOP or Gravity.START
                      p.x = 20
                      p.y = 500
                      var iniX = 0
                      var iniY = 0
                      var toqueX = 0f
                      var toqueY = 0f
                      var moveu = false
                      c.setOnTouchListener { view, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  iniX = p.x
                                  iniY = p.y
                                  toqueX = e.rawX
                                  toqueY = e.rawY
                                  moveu = false
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = e.rawX - toqueX
                                  val dy = e.rawY - toqueY
                                  if (Math.abs(dx) > 25 || Math.abs(dy) > 25) moveu = true
                                  if (moveu) {
                                      p.x = iniX + dx.toInt()
                                      p.y = iniY + dy.toInt()
                                      wm.updateViewLayout(view, p)
                                  }
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moveu) aoTocarBotao()
                              }
                          }
                          true
                      }
                      wm.addView(c, p)
                      caixa = c
                      selo = s
                      pBotao = p
                  }
              }

              fun esconderBotao() {
                  ui.post {
                      val v = caixa
                      if (v != null) {
                          val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          try {
                              wm.removeView(v)
                          } catch (e: Exception) {
                          }
                          caixa = null
                          selo = null
                          pBotao = null
                      }
                  }
              }

              private fun aoTocarBotao() {
                  val agora = System.currentTimeMillis()
                  if (agora - ultimoToque < 700) return
                  ultimoToque = agora
                  if (estado == 0) {
                      if (aoVivo) limparAudio()
                      ouvir()
                  } else if (estado == 1) {
                      reconhecedor?.stopListening()
                  } else if (estado == 2) {
                      rodando = false
                      falar("Parei.")
                  }
              }

              fun cancelarTudo() {
                  rodando = false
                  esperando = ""
                  if (ensinando) {
                      ensinando = false
                      removerTelaEnsino()
                      passosEnsino = JSONArray()
                      definirEstado(0)
                  }
              }

              fun iniciarObservacao() {
                  if (observando) return
                  observando = true
                  definirEstado(estado)
                  Thread {
                      while (observando) {
                          try {
                              if (estado != 2 && !ensinando && !aoVivo) {
                                  val b = capturar()
                                  if (b != null) {
                                      val bytes = comprimir(b, 360)
                                      b.recycle()
                                      synchronized(quadros) {
                                          quadros.add(bytes)
                                          tempos.add(System.currentTimeMillis())
                                          while (quadros.size > 20) {
                                              quadros.removeAt(0)
                                              tempos.removeAt(0)
                                          }
                                      }
                                  }
                              }
                              Thread.sleep(500)
                          } catch (e: Exception) {
                          }
                      }
                  }.start()
              }

              fun pararObservacao() {
                  observando = false
                  synchronized(quadros) {
                      quadros.clear()
                      tempos.clear()
                  }
                  definirEstado(estado)
              }

              private fun amostrarQuadros(imgs: ArrayList<String>): String {
                  var idades = ""
                  synchronized(quadros) {
                      val n = quadros.size
                      val alvo = if (n > 4) 4 else n
                      val agora = System.currentTimeMillis()
                      for (q in 0 until alvo) {
                          val k = if (alvo == 1) n - 1 else (q * (n - 1)) / (alvo - 1)
                          imgs.add(b64(quadros[k]))
                          idades += ((agora - tempos[k]) / 1000.0).toString().take(4) + "s "
                      }
                  }
                  return idades
              }

              private fun parecePergunta(t: String): Boolean {
                  val b = t.lowercase().trim()
                  if (b.endsWith("?")) return true
                  val inicios = listOf("o que", "qual", "quais", "quem", "quando", "onde", "como", "por que", "porque", "por quê", "quanto", "quantos", "quantas", "será", "você sabe", "voce sabe", "me diga", "me fala", "me explique", "explique", "diga")
                  for (i in inicios) {
                      if (b.startsWith(i)) return true
                  }
                  return false
              }

              private fun minutosPedidos(t: String): Int {
                  val b = t.lowercase()
                  val m = Regex("(\\d+)\\s*(minutos?|min|horas?)").find(b)
                  if (m != null) {
                      val n = m.groupValues[1].toIntOrNull() ?: 0
                      val un = m.groupValues[2]
                      val total = if (un.startsWith("hora")) n * 60 else n
                      return total.coerceIn(0, 60)
                  }
                  if (b.contains("meia hora")) return 30
                  if (b.contains("uma hora")) return 60
                  if (b.contains("duas horas")) return 60
                  return 0
              }

              private fun avaliacao(t: String): String {
                  val b = t.lowercase().trim()
                  if (b.contains("quase")) return "quase"
                  if (b.contains("no caminho")) return "caminho"
                  if (b.contains("tente novamente") || b.contains("errado") || b.contains("não está") || b.contains("nao esta") || b.startsWith("não") || b.startsWith("nao")) return "refazer"
                  if (b.contains("certo") || b.contains("correto") || b.contains("sim") || b.contains("isso")) return "certo"
                  return ""
              }

              private fun regiao(nx: Double, ny: Double): String {
                  val v = if (ny < 333.0) "superior" else if (ny < 666.0) "do meio" else "inferior"
                  val h = if (nx < 333.0) "esquerda" else if (nx < 666.0) "central" else "direita"
                  return if (v == "do meio" && h == "central") "no centro da tela" else "na parte " + v + " " + h
              }

              private fun tratarResposta(modo: String, t: String) {
                  definirEstado(0)
                  val nome = nomeAtual
                  if (modo == "nome_ensino") {
                      iniciarEnsino(t.trim().lowercase())
                      return
                  }
                  if (modo == "correcao") {
                      salvarNota("(correção em " + nome + ") " + t.trim())
                      falar("Anotei a correção.")
                      return
                  }
                  val av = avaliacao(t)
                  if (av == "") {
                      if (tentRating < 1) {
                          tentRating++
                          falarEDepois("Não entendi. Responda: está certo, no caminho, quase certo ou tente novamente.") {
                              esperando = modo
                              ouvir()
                          }
                      }
                      return
                  }
                  if (av == "certo") {
                      marcar(nome, true)
                      falar("Ótimo, registrado.")
                  } else if (av == "refazer") {
                      marcar(nome, false)
                      if (modo == "ensino") {
                          val r = lerRotinas()
                          r.remove(nome)
                          gravarRotinas(r)
                          falar("Certo, apaguei. Diga: vou te ensinar a " + nome + ", para tentar de novo.")
                      } else {
                          falarEDepois("Entendi. O que eu errei?") {
                              esperando = "correcao"
                              ouvir()
                          }
                      }
                  } else {
                      falarEDepois("Certo. O que devo corrigir?") {
                          esperando = "correcao"
                          ouvir()
                      }
                  }
              }

              fun perguntarNomeEnsino() {
                  if (rodando || ensinando) return
                  falarEDepois("Qual o nome da habilidade que vou aprender?") {
                      esperando = "nome_ensino"
                      ouvir()
                  }
              }

              private fun tratarComando(t: String) {
                  if (esperando.isNotEmpty()) {
                      val modo = esperando
                      esperando = ""
                      tratarResposta(modo, t)
                      return
                  }
                  val baixa = t.lowercase().trim()
                  if (ensinando) {
                      definirEstado(0)
                      if (baixa.contains("terminei") || baixa.contains("acabei") || baixa.contains("fim do ensino") || baixa.contains("pode salvar")) {
                          finalizarEnsino()
                      } else {
                          explicarEnsino(t.trim())
                      }
                      return
                  }
                  if (aoVivo) {
                      definirEstado(0)
                      if (baixa.contains("pare a transmiss") || baixa.contains("parar a transmiss") || baixa.contains("encerre a transmiss") || baixa.contains("encerrar a transmiss") || baixa.contains("pare a transmis")) {
                          pararAoVivo()
                      } else if (baixa.startsWith("vou te ensinar") || baixa.startsWith("ensine") || baixa.startsWith("modo ensino")) {
                          var nome = baixa
                          for (p in listOf("vou te ensinar a ", "vou te ensinar ", "modo ensino ", "ensine ")) {
                              if (nome.startsWith(p)) {
                                  nome = nome.removePrefix(p)
                                  break
                              }
                          }
                          nome = nome.trim().removePrefix("a ").trim()
                          if (nome.isEmpty() || nome == baixa) perguntarNomeEnsino() else iniciarEnsino(nome)
                      } else {
                          perguntaLive(t.trim())
                      }
                      return
                  }
                  if (baixa.startsWith("transmiss") || baixa.contains("ao vivo") || baixa.contains("assista minha tela") || baixa.contains("assista a minha tela")) {
                      definirEstado(0)
                      iniciarAoVivo()
                      return
                  }
                  if (baixa.contains("pare de observar") || baixa.contains("pare de olhar") || baixa.contains("não observe")) {
                      pararObservacao()
                      falar("Parei de observar.")
                      definirEstado(0)
                      return
                  }
                  if (baixa.startsWith("observe") || baixa.contains("fique de olho") || baixa.contains("comece a observar")) {
                      iniciarObservacao()
                      falar("Observando a tela.")
                      definirEstado(0)
                      return
                  }
                  if (baixa.contains("esqueça tudo") || baixa.contains("esqueca tudo")) {
                      gravarNotas(emptyList())
                      falar("Esqueci tudo.")
                      definirEstado(0)
                      return
                  }
                  if (baixa.startsWith("vou te ensinar") || baixa.startsWith("ensine") || baixa.startsWith("modo ensino")) {
                      var nome = baixa
                      for (p in listOf("vou te ensinar a ", "vou te ensinar ", "modo ensino ", "ensine ")) {
                          if (nome.startsWith(p)) {
                              nome = nome.removePrefix(p)
                              break
                          }
                      }
                      nome = nome.trim().removePrefix("a ").trim()
                      definirEstado(0)
                      if (nome.isEmpty() || nome == baixa) {
                          perguntarNomeEnsino()
                      } else {
                          iniciarEnsino(nome)
                      }
                      return
                  }
                  if ((baixa.startsWith("salve") || baixa.startsWith("salvar") || baixa.startsWith("grave")) && baixa.contains(" como ")) {
                      val nome = baixa.substringAfter(" como ").trim()
                      if (nome.isEmpty() || ultimaSeq.length() == 0) {
                          falar("Não tenho nada para salvar. Peça uma tarefa primeiro.")
                      } else {
                          val r = lerRotinas()
                          r.put(nome, ultimaSeq)
                          gravarRotinas(r)
                          falar("Rotina " + nome + " salva com " + ultimaSeq.length() + " ações.")
                      }
                      definirEstado(0)
                      return
                  }
                  if (baixa.startsWith("apague a rotina") || baixa.startsWith("apague rotina") || baixa.startsWith("exclua a rotina")) {
                      val nome = baixa.substringAfter("rotina").trim()
                      val r = lerRotinas()
                      if (r.has(nome)) {
                          r.remove(nome)
                          gravarRotinas(r)
                          falar("Rotina apagada.")
                      } else {
                          falar("Não achei essa rotina.")
                      }
                      definirEstado(0)
                      return
                  }
                  if (baixa.contains("minhas rotinas") || baixa.contains("quais rotinas") || baixa.contains("listar rotinas") || baixa.contains("liste as rotinas") || baixa.contains("minhas habilidades")) {
                      val ks = lerRotinas().keys()
                      val nomes = ArrayList<String>()
                      while (ks.hasNext()) nomes.add(ks.next())
                      falar(if (nomes.isEmpty()) "Você não tem rotinas salvas." else "Suas rotinas: " + nomes.take(8).joinToString(", "))
                      definirEstado(0)
                      return
                  }
                  val rot = lerRotinas()
                  var achada = ""
                  val ks2 = rot.keys()
                  while (ks2.hasNext()) {
                      val k = ks2.next()
                      if (k.isNotEmpty() && baixa.contains(k) && k.length > achada.length) achada = k
                  }
                  if (achada.isNotEmpty() && (baixa.startsWith("execute") || baixa.startsWith("rode") || baixa.startsWith("repita") || baixa.startsWith("faça a rotina") || baixa.startsWith("faca a rotina") || baixa.startsWith("inicie") || baixa.startsWith("faça a habilidade") || baixa.startsWith("faca a habilidade"))) {
                      val vezes = Regex("(\\d+)\\s*vezes?").find(baixa)?.groupValues?.get(1)?.toIntOrNull() ?: 1
                      val minutos = minutosPedidos(baixa)
                      val rapido = baixa.contains("rápido") || baixa.contains("rapido") || vezes > 1 || minutos > 0
                      rodarRotina(rot.getJSONArray(achada), vezes.coerceIn(1, 500), minutos, achada, !rapido)
                      return
                  }
                  if (baixa.startsWith("estud")) {
                      estudar(0L)
                      return
                  }
                  if (baixa.startsWith("aprend") || baixa.startsWith("lembr") || baixa.startsWith("anot") || baixa.startsWith("guarde") || baixa.startsWith("memoriz")) {
                      var nota = t.trim().substringAfter(" ", "").trim()
                      if (nota.lowercase().startsWith("que ")) nota = nota.substring(4)
                      if (nota.isNotEmpty()) {
                          salvarNota(nota)
                          falar("Aprendi: " + nota.take(80))
                      } else {
                          falar("O que devo aprender?")
                      }
                      definirEstado(0)
                      return
                  }
                  executar(t)
              }

              private fun ouvir() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      aviso("Reconhecimento de voz indisponível neste celular.")
                      esperando = ""
                      definirEstado(0)
                      return
                  }
                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      aviso("Permita o microfone, no app Agente.")
                      esperando = ""
                      definirEstado(0)
                      return
                  }
                  sessao++
                  val minha = sessao
                  reconhecedor?.destroy()
                  val sr = SpeechRecognizer.createSpeechRecognizer(this)
                  reconhecedor = sr
                  sr.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) {
                          if (minha == sessao) definirEstado(1)
                      }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(t: Int, p: Bundle?) {}
                      override fun onError(codigo: Int) {
                          if (minha != sessao) return
                          sessao++
                          esperando = ""
                          definirEstado(0)
                          if (codigo == 6 || codigo == 7) {
                              falar("Não ouvi nada. Toque e fale logo depois do vermelho.")
                          } else {
                              aviso("Erro de voz, código " + codigo)
                              falar("Não entendi.")
                          }
                      }
                      override fun onResults(r: Bundle?) {
                          if (minha != sessao) return
                          sessao++
                          val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t.isNullOrEmpty()) {
                              esperando = ""
                              definirEstado(0)
                          } else {
                              tratarComando(t)
                          }
                      }
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 2000L)
                  i.putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, 2000L)
                  definirEstado(3)
                  sr.startListening(i)
                  ui.postDelayed({
                      if (minha == sessao && estado == 3) {
                          sessao++
                          esperando = ""
                          reconhecedor?.cancel()
                          definirEstado(0)
                          aviso("O microfone não respondeu. Toque de novo.")
                      }
                  }, 6000)
              }

              private fun px(n: Double, total: Int): Float {
                  return (n / 1000.0 * total).coerceIn(1.0, (total - 1).toDouble()).toFloat()
              }

              private fun gesto(caminho: Path, ms: Long) {
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(caminho, 0, ms))
                      .build()
                  dispatchGesture(g, null, null)
              }

              private fun tocar(xn: Double, yn: Double, w: Int, h: Int) {
                  if (xn.isNaN() || yn.isNaN()) return
                  val p = Path()
                  p.moveTo(px(xn, w), px(yn, h))
                  gesto(p, 60)
              }

              private fun segurar(xn: Double, yn: Double, ms: Long, w: Int, h: Int) {
                  if (xn.isNaN() || yn.isNaN()) return
                  val duracao = ms.coerceIn(300L, 60000L)
                  val p = Path()
                  p.moveTo(px(xn, w), px(yn, h))
                  gesto(p, duracao)
                  dormir(duracao)
              }

              private fun mover(a: JSONObject, w: Int, h: Int) {
                  val x = a.optDouble("x")
                  val y = a.optDouble("y")
                  val dx = a.optDouble("dx")
                  val dy = a.optDouble("dy")
                  if (x.isNaN() || y.isNaN() || dx.isNaN() || dy.isNaN()) return
                  val duracao = a.optLong("ms", 1000L).coerceIn(300L, 60000L)
                  val p = Path()
                  p.moveTo(px(x, w), px(y, h))
                  p.lineTo(px(x + dx, w), px(y + dy, h))
                  gesto(p, duracao)
                  dormir(duracao)
              }

              private fun deslizar(a: JSONObject, w: Int, h: Int) {
                  val x1 = a.optDouble("x1")
                  val y1 = a.optDouble("y1")
                  val x2 = a.optDouble("x2")
                  val y2 = a.optDouble("y2")
                  if (x1.isNaN() || y1.isNaN() || x2.isNaN() || y2.isNaN()) return
                  val p = Path()
                  p.moveTo(px(x1, w), px(y1, h))
                  p.lineTo(px(x2, w), px(y2, h))
                  gesto(p, 400)
              }

              private fun executarAcao(a: JSONObject, w: Int, h: Int) {
                  val acao = a.optString("acao")
                  if (acao == "tocar") {
                      tocar(a.optDouble("x"), a.optDouble("y"), w, h)
                  } else if (acao == "segurar") {
                      segurar(a.optDouble("x"), a.optDouble("y"), a.optLong("ms", 1000L), w, h)
                  } else if (acao == "mover") {
                      mover(a, w, h)
                  } else if (acao == "deslizar") {
                      deslizar(a, w, h)
                  } else if (acao == "voltar") {
                      performGlobalAction(GLOBAL_ACTION_BACK)
                  } else if (acao == "inicio") {
                      performGlobalAction(GLOBAL_ACTION_HOME)
                  } else if (acao == "esperar") {
                      dormir(a.optLong("ms", 1000L).coerceIn(200L, 30000L))
                  }
              }

              private fun capturar(): Bitmap? {
                  val ref = arrayOfNulls<Bitmap>(1)
                  val trava = CountDownLatch(1)
                  takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : AccessibilityService.TakeScreenshotCallback {
                      override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                          try {
                              val hw = Bitmap.wrapHardwareBuffer(r.hardwareBuffer, r.colorSpace)
                              ref[0] = hw?.copy(Bitmap.Config.ARGB_8888, false)
                              r.hardwareBuffer.close()
                          } catch (e: Exception) {
                          }
                          trava.countDown()
                      }

                      override fun onFailure(errorCode: Int) {
                          trava.countDown()
                      }
                  })
                  trava.await(6, TimeUnit.SECONDS)
                  return ref[0]
              }

              private fun comprimir(b: Bitmap, w: Int): ByteArray {
                  val h = (b.height * w / b.width.toFloat()).toInt()
                  val s = Bitmap.createScaledBitmap(b, w, h, true)
                  val o = ByteArrayOutputStream()
                  s.compress(Bitmap.CompressFormat.JPEG, 65, o)
                  if (s !== b) s.recycle()
                  return o.toByteArray()
              }

              private fun b64(x: ByteArray): String {
                  return Base64.encodeToString(x, Base64.NO_WRAP)
              }

              private fun perguntarMime(chave: String, modelo: String, pedido: String, imagens: List<Pair<String, String>>, sis: String): String {
                  val partes = JSONArray()
                  partes.put(JSONObject().put("text", pedido))
                  for (im in imagens) {
                      partes.put(JSONObject().put("inlineData", JSONObject().put("mimeType", im.first).put("data", im.second)))
                  }
                  val corpo = JSONObject()
                  corpo.put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sis))))
                  corpo.put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", partes)))
                  corpo.put("generationConfig", JSONObject().put("responseMimeType", "application/json"))
                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/" + modelo + ":generateContent")
                  val c = url.openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000
                  c.readTimeout = 90000
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  c.setRequestProperty("x-goog-api-key", chave)
                  c.outputStream.use { it.write(corpo.toString().toByteArray(Charsets.UTF_8)) }
                  val codigo = c.responseCode
                  val stream = if (codigo in 200..299) c.inputStream else c.errorStream
                  val resposta = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                  if (codigo !in 200..299) throw Exception("Erro " + codigo + ": " + resposta.take(300))
                  val j = JSONObject(resposta)
                  return j.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
              }

              private fun perguntar(chave: String, modelo: String, pedido: String, imagens: List<String>, sis: String = sistema): String {
                  return perguntarMime(chave, modelo, pedido, imagens.map { Pair("image/jpeg", it) }, sis)
              }

              private fun perguntarSeguroMime(chave: String, modelo: String, pedido: String, imgs: List<Pair<String, String>>, sis: String): String? {
                  try {
                      return perguntarMime(chave, modelo, pedido, imgs, sis)
                  } catch (e: Exception) {
                      val m = e.message ?: ""
                      if (!(m.startsWith("Erro 429") || m.startsWith("Erro 503"))) throw e
                  }
                  if (modelo != reserva) {
                      try {
                          return perguntarMime(chave, reserva, pedido, imgs, sis)
                      } catch (e: Exception) {
                          val m = e.message ?: ""
                          if (!(m.startsWith("Erro 429") || m.startsWith("Erro 503"))) throw e
                      }
                  }
                  return null
              }

              private fun perguntarSeguro(chave: String, modelo: String, pedido: String, imgs: List<String>): String? {
                  return perguntarSeguroMime(chave, modelo, pedido, imgs.map { Pair("image/jpeg", it) }, sistema)
              }

              fun iniciarAoVivo() {
                  if (aoVivo) {
                      falar("Já estou transmitindo.")
                      return
                  }
                  if (rodando) {
                      falar("Termine o que estou fazendo primeiro.")
                      return
                  }
                  val prefs = getSharedPreferences("agente", Context.MODE_PRIVATE)
                  val chave = prefs.getString("chave", "") ?: ""
                  val modeloLive = prefs.getString("modelo_live", "gemini-3.1-flash-live-preview") ?: "gemini-3.1-flash-live-preview"
                  if (chave.isEmpty()) {
                      aviso("Cole a chave no app Agente primeiro.")
                      falar("Falta a chave da IA.")
                      return
                  }
                  pararObservacao()
                  aoVivo = true
                  liveOk = false
                  descartarAudio = false
                  definirEstado(estado)
                  falar("Conectando a transmissão.")
                  val url = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=" + chave
                  val pedido = Request.Builder().url(url).build()
                  ws = cliente.newWebSocket(pedido, object : WebSocketListener() {
                      override fun onOpen(webSocket: WebSocket, response: Response) {
                          val cfg = JSONObject()
                          cfg.put("model", "models/" + modeloLive)
                          cfg.put("responseModalities", JSONArray().put("AUDIO"))
                          cfg.put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sistemaLive))))
                          webSocket.send(JSONObject().put("setup", cfg).toString())
                      }

                      override fun onMessage(webSocket: WebSocket, text: String) {
                          try {
                              tratarLive(text)
                          } catch (e: Exception) {
                          }
                      }

                      override fun onMessage(webSocket: WebSocket, bytes: ByteString) {
                          try {
                              tratarLive(bytes.utf8())
                          } catch (e: Exception) {
                          }
                      }

                      override fun onClosing(webSocket: WebSocket, code: Int, reason: String) {
                          webSocket.close(code, null)
                      }

                      override fun onClosed(webSocket: WebSocket, code: Int, reason: String) {
                          aoVivoFim("Transmissão encerrada. " + reason)
                      }

                      override fun onFailure(webSocket: WebSocket, t: Throwable, response: Response?) {
                          aoVivoFim("Falha na transmissão: " + (t.message ?: t.toString()))
                      }
                  })
              }

              private fun fecharLive() {
                  val s = ws
                  ws = null
                  aoVivo = false
                  liveOk = false
                  try {
                      s?.close(1000, "fim")
                  } catch (e: Exception) {
                  }
                  liberarAudio()
                  definirEstado(estado)
              }

              fun pararAoVivo() {
                  if (!aoVivo) return
                  fecharLive()
                  falar("Transmissão encerrada.")
              }

              private fun aoVivoFim(msg: String) {
                  if (!aoVivo) return
                  fecharLive()
                  aviso(msg)
                  falar("A transmissão terminou.")
              }

              private fun tratarLive(txt: String) {
                  val j = JSONObject(txt)
                  if (j.has("setupComplete")) {
                      liveOk = true
                      aviso("Transmissão ao vivo ligada.")
                      falar("Pronto. Estou vendo a sua tela. Toque no botão e fale comigo.")
                      iniciarFrames()
                      return
                  }
                  if (j.has("error")) {
                      aoVivoFim("Erro da IA: " + j.opt("error").toString().take(200))
                      return
                  }
                  val sc = j.optJSONObject("serverContent")
                  if (sc != null) {
                      if (sc.optBoolean("interrupted", false)) limparAudio()
                      val partes = sc.optJSONObject("modelTurn")?.optJSONArray("parts")
                      if (partes != null && !descartarAudio) {
                          for (i in 0 until partes.length()) {
                              val d = partes.getJSONObject(i).optJSONObject("inlineData")?.optString("data", "") ?: ""
                              if (d.isNotEmpty()) {
                                  val bytes = Base64.decode(d, Base64.DEFAULT)
                                  audioExec.execute { tocarPcm(bytes) }
                              }
                          }
                      }
                      if (sc.optBoolean("turnComplete", false)) descartarAudio = false
                  }
                  if (j.has("goAway")) aviso("A sessão ao vivo vai terminar em breve.")
              }

              private fun iniciarFrames() {
                  Thread {
                      while (aoVivo) {
                          try {
                              val s = ws
                              if (s != null && liveOk && System.currentTimeMillis() - ultimoDown > 1500L && !rodando) {
                                  val b = capturar()
                                  if (b != null) {
                                      val bytes = comprimir(b, 640)
                                      b.recycle()
                                      val m = JSONObject().put("realtimeInput", JSONObject().put("video", JSONObject().put("data", b64(bytes)).put("mimeType", "image/jpeg")))
                                      s.send(m.toString())
                                  }
                              }
                              Thread.sleep(1000)
                          } catch (e: Exception) {
                          }
                      }
                  }.start()
              }

              private fun eventoLive(txt: String, silencioso: Boolean) {
                  val s = ws
                  if (!aoVivo || !liveOk || s == null) return
                  if (silencioso) descartarAudio = true
                  s.send(JSONObject().put("realtimeInput", JSONObject().put("text", txt)).toString())
              }

              private fun perguntaLive(t: String) {
                  val s = ws
                  if (!aoVivo || !liveOk || s == null) {
                      falar("A transmissão ainda não está pronta.")
                      return
                  }
                  descartarAudio = false
                  limparAudio()
                  s.send(JSONObject().put("realtimeInput", JSONObject().put("text", t)).toString())
              }

              private fun criarTrilha(): AudioTrack {
                  val min = AudioTrack.getMinBufferSize(24000, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT)
                  val nova = AudioTrack.Builder()
                      .setAudioAttributes(
                          AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_ASSISTANT)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                              .build()
                      )
                      .setAudioFormat(
                          AudioFormat.Builder()
                              .setSampleRate(24000)
                              .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                              .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                              .build()
                      )
                      .setBufferSizeInBytes(Math.max(min, 48000))
                      .setTransferMode(AudioTrack.MODE_STREAM)
                      .build()
                  nova.play()
                  trilha = nova
                  return nova
              }

              private fun tocarPcm(b: ByteArray) {
                  try {
                      val t = trilha ?: criarTrilha()
                      t.write(b, 0, b.size)
                  } catch (e: Exception) {
                  }
              }

              private fun limparAudio() {
                  try {
                      audioExec.execute {
                          try {
                              trilha?.pause()
                              trilha?.flush()
                              trilha?.play()
                          } catch (e: Exception) {
                          }
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun liberarAudio() {
                  try {
                      audioExec.execute {
                          try {
                              trilha?.stop()
                              trilha?.release()
                          } catch (e: Exception) {
                          }
                          trilha = null
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun criarTelaEnsino() {
                  if (telaEnsino != null) return
                  if (!Settings.canDrawOverlays(this)) {
                      aviso("Permita exibir sobre outros apps, no app Agente.")
                      ensinando = false
                      definirEstado(0)
                      return
                  }
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val v = TelaEnsino(this)
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  p.gravity = Gravity.TOP or Gravity.START
                  var x0 = 0f
                  var y0 = 0f
                  var xf = 0f
                  var yf = 0f
                  var t0 = 0L
                  var moveu = false
                  var holder = arrayOfNulls<Bitmap>(1)
                  var th: Thread? = null
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              x0 = e.rawX
                              y0 = e.rawY
                              xf = x0
                              yf = y0
                              t0 = System.currentTimeMillis()
                              ultimoDown = t0
                              moveu = false
                              val h2 = arrayOfNulls<Bitmap>(1)
                              holder = h2
                              val nova = Thread { h2[0] = capturar() }
                              th = nova
                              nova.start()
                          }
                          MotionEvent.ACTION_MOVE -> {
                              xf = e.rawX
                              yf = e.rawY
                              if (Math.abs(xf - x0) > 30f || Math.abs(yf - y0) > 30f) moveu = true
                          }
                          MotionEvent.ACTION_UP -> {
                              xf = e.rawX
                              yf = e.rawY
                              val dur = System.currentTimeMillis() - t0
                              val ax = x0
                              val ay = y0
                              val bx = xf
                              val by = yf
                              val mv = moveu
                              val hh = holder
                              val tt = th
                              v.marcas.add(Marca(ax, ay, System.currentTimeMillis()))
                              v.invalidate()
                              Thread { processarToque(ax, ay, bx, by, dur, mv, hh, tt) }.start()
                          }
                      }
                      true
                  }
                  wm.addView(v, p)
                  telaEnsino = v
                  pEnsino = p
              }

              private fun removerTelaEnsino() {
                  ui.post {
                      val v = telaEnsino
                      if (v != null) {
                          val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          try {
                              wm.removeView(v)
                          } catch (e: Exception) {
                          }
                          telaEnsino = null
                          pEnsino = null
                      }
                  }
              }

              private fun tocavel(on: Boolean) {
                  val p = pEnsino
                  val v = telaEnsino
                  if (p != null && v != null) {
                      p.flags = if (on) {
                          p.flags and WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE.inv()
                      } else {
                          p.flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                      }
                      try {
                          val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          wm.updateViewLayout(v, p)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun iniciarEnsino(nome: String) {
                  if (rodando || ensinando) {
                      falar("Já estou ocupado.")
                      return
                  }
                  pararObservacao()
                  ensinoNome = nome
                  ensinoObjetivo = ""
                  passosEnsino = JSONArray()
                  ensinando = true
                  definirEstado(0)
                  ui.post {
                      criarTelaEnsino()
                      recriarBotao()
                  }
                  eventoLive("[EVENTO] Começou o modo ensino da habilidade " + nome + ". Observe a tela e o que o usuário faz.", true)
                  falar("Modo ensino. Diga o objetivo tocando no botão, ou comece a tocar na tela. Para terminar, toque no botão e diga: terminei.")
              }

              private fun explicarEnsino(frase: String) {
                  if (frase.isEmpty()) return
                  salvarNota("(ensino " + ensinoNome + ") " + frase)
                  val primeiro = passosEnsino.length() == 0
                  if (primeiro) {
                      ensinoObjetivo = if (ensinoObjetivo.isEmpty()) frase else ensinoObjetivo + " " + frase
                  } else {
                      val ult = passosEnsino.getJSONObject(passosEnsino.length() - 1)
                      val ant = ult.optString("explicacao", "")
                      ult.put("explicacao", if (ant.isEmpty()) frase else ant + " " + frase)
                  }
                  if (aoVivo && parecePergunta(frase)) {
                      perguntaLive(frase)
                  } else {
                      eventoLive("[EVENTO] O usuário explicou " + (if (primeiro) "o objetivo" else "o passo atual") + ": " + frase, true)
                      falar(if (primeiro) "Objetivo anotado." else "Anotado.")
                  }
              }

              private fun processarToque(ax: Float, ay: Float, bx: Float, by: Float, dur: Long, mv: Boolean, holder: Array<Bitmap?>, th: Thread?) {
                  try {
                      reproduzir(ax, ay, bx, by, dur, mv)
                      th?.join(2500)
                      registrarPasso(ax, ay, bx, by, dur, mv, holder[0])
                  } catch (e: Exception) {
                      aviso("Erro ao registrar o toque: " + (e.message ?: e.toString()))
                  }
              }

              private fun reproduzir(ax: Float, ay: Float, bx: Float, by: Float, dur: Long, mv: Boolean) {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val b = wm.maximumWindowMetrics.bounds
                  val w = b.width().toFloat()
                  val h = b.height().toFloat()
                  ui.post { tocavel(false) }
                  Thread.sleep(80)
                  val p = Path()
                  p.moveTo(ax.coerceIn(1f, w - 1f), ay.coerceIn(1f, h - 1f))
                  if (mv) p.lineTo(bx.coerceIn(1f, w - 1f), by.coerceIn(1f, h - 1f))
                  val ms = if (mv) dur.coerceIn(150L, 3000L) else if (dur >= 600L) dur.coerceIn(300L, 60000L) else 60L
                  gesto(p, ms)
                  Thread.sleep(ms + 250L)
                  ui.post { tocavel(true) }
              }

              private fun registrarPasso(ax: Float, ay: Float, bx: Float, by: Float, dur: Long, mv: Boolean, ref: Bitmap?) {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  val b = wm.maximumWindowMetrics.bounds
                  val w = b.width().toFloat()
                  val h = b.height().toFloat()
                  val nx = (ax / w * 1000.0)
                  val ny = (ay / h * 1000.0)
                  val a = JSONObject()
                  if (mv) {
                      a.put("acao", "deslizar")
                      a.put("x", nx)
                      a.put("y", ny)
                      a.put("x1", nx)
                      a.put("y1", ny)
                      a.put("x2", bx / w * 1000.0)
                      a.put("y2", by / h * 1000.0)
                  } else if (dur >= 600L) {
                      a.put("acao", "segurar")
                      a.put("x", nx)
                      a.put("y", ny)
                      a.put("ms", dur)
                  } else {
                      a.put("acao", "tocar")
                      a.put("x", nx)
                      a.put("y", ny)
                  }
                  if (ref != null && ref.width > 240 && ref.height > 240) {
                      val tam = 220
                      val sx = (ax / w * ref.width).toInt().coerceIn(tam / 2, ref.width - tam / 2)
                      val sy = (ay / h * ref.height).toInt().coerceIn(tam / 2, ref.height - tam / 2)
                      val rec = Bitmap.createBitmap(ref, sx - tam / 2, sy - tam / 2, tam, tam)
                      val dir = File(filesDir, "refs")
                      dir.mkdirs()
                      val nomeArq = "p" + System.currentTimeMillis() + ".png"
                      FileOutputStream(File(dir, nomeArq)).use { rec.compress(Bitmap.CompressFormat.PNG, 100, it) }
                      a.put("ref", nomeArq)
                  }
                  passosEnsino.put(a)
                  val tipoTxt = if (mv) "arrastou" else if (dur >= 600L) "segurou por " + (dur / 1000.0).toString().take(3) + " segundos" else "tocou"
                  val fim = if (mv) " até " + regiao(bx / w * 1000.0, by / h * 1000.0) else ""
                  eventoLive("[EVENTO] O usuário " + tipoTxt + " " + regiao(nx, ny) + " (x=" + nx.toInt() + ", y=" + ny.toInt() + " de 1000)" + fim + ". Passo " + passosEnsino.length() + " da habilidade " + ensinoNome + ".", true)
              }

              private fun verbo(acao: String): String {
                  return if (acao == "tocar") "toquei em" else if (acao == "segurar") "segurei" else "arrastei a partir de"
              }

              private fun rotular(passos: JSONArray) {
                  val prefs = getSharedPreferences("agente", Context.MODE_PRIVATE)
                  val chave = prefs.getString("chave", "") ?: ""
                  val modelo = prefs.getString("modelo", "gemini-flash-latest") ?: "gemini-flash-latest"
                  if (chave.isEmpty()) return
                  val imgs = ArrayList<Pair<String, String>>()
                  val idx = ArrayList<Int>()
                  for (i in 0 until Math.min(passos.length(), 8)) {
                      val ref = passos.getJSONObject(i).optString("ref", "")
                      if (ref.isNotEmpty()) {
                          val f = File(File(filesDir, "refs"), ref)
                          if (f.exists()) {
                              imgs.add(Pair("image/png", b64(f.readBytes())))
                              idx.add(i)
                          }
                      }
                  }
                  if (imgs.isEmpty()) return
                  val texto = perguntarSeguroMime(chave, modelo, "Cada imagem é um recorte da tela onde o usuário tocou, na ordem. Descreva cada um em até 6 palavras, por exemplo: botão Jogar, ícone da mochila.", imgs, sistemaRotulo) ?: return
                  val arr = JSONObject(texto.trim()).optJSONArray("rotulos") ?: return
                  for (k in 0 until Math.min(arr.length(), idx.size)) {
                      passos.getJSONObject(idx[k]).put("rotulo", arr.optString(k))
                  }
              }

              private fun finalizarEnsino() {
                  ensinando = false
                  removerTelaEnsino()
                  val nome = ensinoNome
                  val passos = passosEnsino
                  val objetivo = ensinoObjetivo
                  definirEstado(0)
                  recriarBotao()
                  eventoLive("[EVENTO] O ensino da habilidade " + nome + " terminou.", true)
                  Thread {
                      try {
                          Thread.sleep(900)
                          if (passos.length() == 0) {
                              falar("Não aprendi nenhum passo.")
                              return@Thread
                          }
                          try {
                              rotular(passos)
                          } catch (e: Exception) {
                          }
                          val r = lerRotinas()
                          r.put(nome, passos)
                          gravarRotinas(r)
                          if (objetivo.isNotEmpty()) {
                              val o = lerObjetivos()
                              o.put(nome, objetivo)
                              getSharedPreferences("agente", Context.MODE_PRIVATE).edit().putString("objetivos", o.toString()).apply()
                          }
                          val sb = StringBuilder("Aprendi " + passos.length() + " passos. ")
                          if (objetivo.isNotEmpty()) sb.append("O objetivo é: ").append(objetivo.take(120)).append(". ")
                          for (i in 0 until Math.min(5, passos.length())) {
                              val p = passos.getJSONObject(i)
                              sb.append(i + 1).append(", ").append(verbo(p.optString("acao"))).append(" ").append(p.optString("rotulo", "um ponto da tela")).append(". ")
                          }
                          sb.append("Está certo?")
                          falarEDepois(sb.toString()) {
                              nomeAtual = nome
                              tentRating = 0
                              esperando = "ensino"
                              ouvir()
                          }
                      } catch (e: Exception) {
                          aviso("Erro ao salvar o que aprendi: " + (e.message ?: e.toString()))
                      }
                  }.start()
              }

              private fun localizar(passo: JSONObject, chave: String, modelo: String): DoubleArray? {
                  val refNome = passo.optString("ref", "")
                  val f = File(File(filesDir, "refs"), refNome)
                  if (refNome.isEmpty() || !f.exists()) return doubleArrayOf(passo.optDouble("x"), passo.optDouble("y"))
                  ui.post { caixa?.visibility = View.INVISIBLE }
                  Thread.sleep(200)
                  val tela = capturar()
                  ui.post { caixa?.visibility = View.VISIBLE }
                  if (tela == null) return null
                  val imgs = ArrayList<Pair<String, String>>()
                  imgs.add(Pair("image/png", b64(f.readBytes())))
                  imgs.add(Pair("image/jpeg", b64(comprimir(tela, 720))))
                  val rot = passo.optString("rotulo", "o elemento")
                  val expl = passo.optString("explicacao", "")
                  val pedido = "Procure na segunda imagem (a tela atual) o elemento mostrado na primeira imagem (um recorte): " + rot + "." + (if (expl.isNotEmpty()) " O usuário explicou: " + expl + "." else "") + " Responda JSON {\"achou\":true ou false,\"x\":N,\"y\":N,\"confianca\":0 a 1}, com x e y de 0 a 1000 sobre a segunda imagem, apontando o centro do elemento."
                  val texto = perguntarSeguroMime(chave, modelo, pedido, imgs, sistemaLocalizar) ?: return null
                  val j = JSONObject(texto.trim())
                  if (!j.optBoolean("achou", false) || j.optDouble("confianca", 0.0) < 0.5) return null
                  val x = j.optDouble("x")
                  val y = j.optDouble("y")
                  if (x.isNaN() || y.isNaN()) return null
                  return doubleArrayOf(x, y)
              }

              private fun verificarObjetivo(nome: String, chave: String, modelo: String): String {
                  val obj = lerObjetivos().optString(nome, "")
                  if (obj.isEmpty() || chave.isEmpty()) return ""
                  ui.post { caixa?.visibility = View.INVISIBLE }
                  Thread.sleep(1200)
                  val tela = capturar()
                  ui.post { caixa?.visibility = View.VISIBLE }
                  if (tela == null) return ""
                  val imgs = ArrayList<Pair<String, String>>()
                  imgs.add(Pair("image/jpeg", b64(comprimir(tela, 720))))
                  val pedido = "O objetivo da habilidade era: " + obj + ". Olhe a tela agora e diga se o objetivo parece atingido. Responda JSON {\"atingido\":true ou false,\"motivo\":\"frase curta\"}."
                  val texto = perguntarSeguroMime(chave, modelo, pedido, imgs, sistemaVerifica) ?: return ""
                  val j = JSONObject(texto.trim())
                  val ok = j.optBoolean("atingido", false)
                  return (if (ok) "Parece que o objetivo foi atingido. " else "Não parece que o objetivo foi atingido. ") + j.optString("motivo", "")
              }

              fun estudarDepois() {
                  estudar(5000L)
              }

              private fun estudar(atrasoMs: Long) {
                  val prefs = getSharedPreferences("agente", Context.MODE_PRIVATE)
                  val chave = prefs.getString("chave", "") ?: ""
                  val modelo = prefs.getString("modelo", "gemini-flash-latest") ?: "gemini-flash-latest"
                  if (chave.isEmpty()) {
                      definirEstado(0)
                      aviso("Cole a chave no app Agente primeiro.")
                      falar("Falta a chave da IA.")
                      return
                  }
                  if (rodando) return
                  rodando = true
                  definirEstado(2)
                  if (atrasoMs > 0L) aviso("Estudando a tela em 5 segundos. Abra o jogo ou app.")
                  Thread {
                      try {
                          if (atrasoMs > 0L) Thread.sleep(atrasoMs)
                          falar("Estudando a tela.")
                          ui.post { caixa?.visibility = View.INVISIBLE }
                          Thread.sleep(250)
                          val tela = capturar()
                          ui.post { caixa?.visibility = View.VISIBLE }
                          if (tela == null) {
                              falar("Não consegui ver a tela.")
                              return@Thread
                          }
                          val imgs = ArrayList<String>()
                          amostrarQuadros(imgs)
                          imgs.add(b64(comprimir(tela, 720)))
                          val notas = lerNotas()
                          val sabe = if (notas.isEmpty()) "nada ainda" else notas.joinToString("\n- ", "- ")
                          val texto = perguntar(chave, modelo, "Estude esta tela. O que você já sabe:\n" + sabe, imgs, sistemaEstudo)
                          val ls = JSONObject(texto.trim()).optJSONArray("licoes")
                          var n = 0
                          if (ls != null) {
                              for (k in 0 until ls.length()) {
                                  val l = ls.optString(k).trim()
                                  if (l.isNotEmpty()) {
                                      salvarNota("(estudo) " + l)
                                      n++
                                  }
                              }
                          }
                          falar(if (n > 0) "Estudei. Aprendi " + n + " coisas." else "Não consegui aprender nada novo.")
                      } catch (e: Exception) {
                          aviso("Erro: " + (e.message ?: e.toString()))
                          falar("Deu erro.")
                      } finally {
                          rodando = false
                          definirEstado(0)
                          ui.post { caixa?.visibility = View.VISIBLE }
                      }
                  }.start()
              }

              private fun rodarRotina(acoes: JSONArray, vezes: Int, minutos: Int, nome: String, visao: Boolean) {
                  if (rodando) {
                      definirEstado(2)
                      return
                  }
                  val prefs = getSharedPreferences("agente", Context.MODE_PRIVATE)
                  val chave = prefs.getString("chave", "") ?: ""
                  val modelo = prefs.getString("modelo", "gemini-flash-latest") ?: "gemini-flash-latest"
                  val comVisao = visao && chave.isNotEmpty()
                  rodando = true
                  definirEstado(2)
                  manterTela(true)
                  falar("Executando " + nome + (if (comVisao) " com visão." else " no modo rápido."))
                  val limiteMs = minutos * 60000L
                  Thread {
                      var terminouBem = false
                      var naoAchou = ""
                      var verif = ""
                      try {
                          Thread.sleep(2500)
                          val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                          val b = wm.maximumWindowMetrics.bounds
                          val w = b.width()
                          val h = b.height()
                          val inicio = System.currentTimeMillis()
                          var rep = 0
                          while (rodando && naoAchou.isEmpty()) {
                              rep++
                              if (limiteMs == 0L && rep > vezes) break
                              if (limiteMs > 0L && System.currentTimeMillis() - inicio > limiteMs) break
                              for (i in 0 until acoes.length()) {
                                  if (!rodando) break
                                  var a = acoes.getJSONObject(i)
                                  if (comVisao && a.has("ref")) {
                                      val pos = localizar(a, chave, modelo)
                                      if (pos == null || pos[0].isNaN() || pos[1].isNaN()) {
                                          naoAchou = a.optString("rotulo", "um botão")
                                          break
                                      }
                                      val dx = pos[0] - a.optDouble("x")
                                      val dy = pos[1] - a.optDouble("y")
                                      val b2 = JSONObject(a.toString())
                                      b2.put("x", pos[0])
                                      b2.put("y", pos[1])
                                      if (b2.has("x1")) {
                                          b2.put("x1", a.optDouble("x1") + dx)
                                          b2.put("y1", a.optDouble("y1") + dy)
                                          b2.put("x2", a.optDouble("x2") + dx)
                                          b2.put("y2", a.optDouble("y2") + dy)
                                      }
                                      a = b2
                                  }
