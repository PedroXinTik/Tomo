          import android.view.accessibility.AccessibilityEvent
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File
          import java.util.Locale

          class AgenteService : AccessibilityService() {

              companion object {
                  var instance: AgenteService? = null
                  @Volatile var rodando = false
              }

              private val ui = Handler(Looper.getMainLooper())
              private var caixa: View? = null
              private var selo: TextView? = null
              private var tts: TextToSpeech? = null
              @Volatile private var estado = 0          // 0 = parado, 1 = ouvindo, 2 = executando
              @Volatile private var observando = false
              private var ultimoToque = 0L

              override fun onServiceConnected() {
                  instance = this
                  tts = TextToSpeech(this) {
                      if (it == TextToSpeech.SUCCESS) tts?.language = Locale("pt", "BR")
                  }
                  mostrarBotao()
              }

              override fun onDestroy() {
                  rodando = false
                  observando = false
                  esconderBotao()
                  tts?.shutdown()
                  instance = null
                  super.onDestroy()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              private fun aviso(msg: String) {
                  ui.post { Toast.makeText(this, msg, Toast.LENGTH_LONG).show() }
              }

              private fun falar(texto: String) {
                  ui.post { tts?.speak(texto, TextToSpeech.QUEUE_FLUSH, null, "agente") }
              }

              private fun rotulo(): String {
                  return when {
                      estado == 1 -> "🔴"
                      estado == 2 -> "⏳"
                      observando -> "👁"
                      else -> "🎤"
      name: Gerar APK do Agente

