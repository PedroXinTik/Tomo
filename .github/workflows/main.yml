herename: Gerar APK do Tomo Shogun

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Criar o projeto Android
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p proj/app/src/main/java/com/tomo/app proj/app/src/main/res/values proj/app/src/main/res/xml proj/app/src/main/res/mipmap-anydpi-v26

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Tomo"
          include ":app"
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tomo.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tomo.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              
              <application
                  android:label="Tomo Shogun"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".TomoAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackSpoken"
              android:accessibilityFlags="flagDefault|flagRetrieveWindowContent|flagRequestTouchExplorationMode"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc"
              android:settingsActivity="com.tomo.app.MainActivity"/>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="accessibility_desc">O Tomo Shogun precisa da acessibilidade para executar cliques automáticos na tela a seu pedido.</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fundo">#090D16</color>
          </resources>
          EOF

          cat > proj/app/src/main/java/com/tomo/app/TomoAccessibilityService.kt <<'EOF'
          package com.tomo.app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class TomoAccessibilityService : AccessibilityService() {
              companion5 object {
                  var instance: TomoAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              fun clicarNaTela(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 50)
                  val builder = GestureDescription.Builder().addStroke(stroke)
                  dispatchGesture(builder.build(), null, null)
              }
          }
          EOF

          cat > proj/app/src/main/java/com/tomo/app/MainActivity.kt <<'EOF'
          package com.tomo.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  
                  web.addJavascriptInterface(WebAppInterface(this), "AndroidShogun")

                  web.webChromeClient = object : WebChromeClient() {
                      override fun onPermissionRequest(request: PermissionRequest?) {
                          request?.grant(request.resources)
                      }
                  }
                  
                  web.webViewClient = WebViewClient()
                  setContentView(web)
                  web.loadUrl("URL_AQUI")
              }

              class WebAppInterface(private val activity: Activity) {
                  @JavascriptInterface
                  def abrirConfiguracoesAcessibilidade() {
                      val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      activity.startActivity(intent)
                  }

                  @JavascriptInterface
                  def executarClique(x: Float, y: Float) {
                      TomoAccessibilityService.instance?.clicarNaTela(x, y)
                  }
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF

          sed -i "s|URL_AQUI|$SITE|" proj/app/src/main/java/com/tomo/app/MainActivity.kt

      - name: Compilar o APK
        working-direction: proj
        run: gradle assembleDebug --no-daemon

      - name: Publicar o APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tomo-v${{ github.run_number }}
          name: Tomo Shogun v${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
