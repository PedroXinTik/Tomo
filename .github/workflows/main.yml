name: Gerar APK do Agente

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Criar o projeto Android
        run: |
          mkdir -p proj/app/src/main/java/com/tomo/agente
          mkdir -p proj/app/src/main/res/xml
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/layout

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Agente"
          include ":app"
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tomo.agente'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tomo.agente'
                  minSdk 30
                  targetSdk 34
                  versionCode 8
                  versionName '8.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.google.mlkit:face-detection:16.1.7'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService"/>
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE"/>
                  </intent>
              </queries>
              <application
                  android:label="Agente"
                  android:allowBackup="false"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <activity android:name=".VerifierActivity" android:exported="false"/>

                  <service
                      android:name=".AgenteService"
                      android:exported="true"
                      android:label="Agente"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canTakeScreenshot="true"
              android:description="@string/desc"
              android:notificationTimeout="100"/>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="desc">Permite que o Agente veja a tela e toque nela quando você pedir por voz.</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Agente"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginBottom="32dp"/>

              <Button
                  android:id="@+id/btnAcessibilidade"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="1. Ativar Acessibilidade"
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="2. Permitir Overlay"
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnVerifier"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Verificador de Imagem"/>
          </LinearLayout>
          EOF

          cat > proj/app/src/main/res/layout/activity_verifier.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="16dp">

              <Button
                  android:id="@+id/btnSelect"
