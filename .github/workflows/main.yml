name: Agente V8 - Gerar APK Futurista

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar_apk_agente_v8.yml'

permissions:
  contents: read

concurrency:
  group: agente-v8-build
  cancel-in-progress: true

jobs:
  build:
    name: Construir APK do Agente V8
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p proj/app/src/main/java/com/tomo/agente
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/drawable
          mkdir -p proj/app/src/main/res/xml

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AgenteV8"
          include(":app")
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tomo.agente'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.tomo.agente'
                  minSdk 30
                  targetSdk 35
                  versionCode 9
                  versionName '8.1'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:allowBackup="false"
                  android:label="Agente V8"
                  android:supportsRtl="true"
                  android:theme="@style/AgenteTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".AgenteService"
                      android:exported="true"
                      android:label="Agente V8"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>

                  </service>

              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AgenteTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#9C7BFF</item>
                  <item name="android:statusBarColor">#080D20</item>
                  <item name="android:navigationBarColor">#080D20</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Agente V8</string>
              <string name="accessibility_description">Serviço de acessibilidade do Agente V8. Os gestos são iniciados por solicitação do usuário.</string>
          </resources>
          EOF

          cat > proj/app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/accessibility_description"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100"/>
          EOF

          cat > proj/app/src/main/res/drawable/panel_background.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#151D3B"/>
              <corners android:radius="24dp"/>
              <stroke android:width="1dp" android:color="#394A82"/>
          </shape>
          EOF

          cat > proj/app/src/main/res/drawable/button_background.xml <<'EOF'
          <ripple xmlns:android="http://schemas.android.com/apk/res/android"
              android:color="#7768D8">
              <item>
                  <shape>
                      <solid android:color="#283968"/>
                      <corners android:radius="22dp"/>
                      <stroke android:width="1dp" android:color="#6179CA"/>
                  </shape>
              </item>
          </ripple>
          EOF

          cat > proj/app/src/main/java/com/tomo/agente/AgenteService.kt <<'EOF'
          package com.tomo.agente

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent

          class AgenteService : AccessibilityService() {

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instancia = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onDestroy() {
                  if (instancia === this) instancia = null
                  super.onDestroy()
              }

              fun tocar(x: Float, y: Float): Boolean {
                  val path = Path().apply {
                      moveTo(x, y)
                  }

                  val gesture = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              path,
                              0,
                              100
                          )
                      )
                      .build()

                  return dispatchGesture(gesture, null, null)
              }

              fun deslizar(
                  x1: Float,
                  y1: Float,
                  x2: Float,
                  y2: Float,
                  duracao: Long = 400
              ): Boolean {
                  val path = Path().apply {
                      moveTo(x1, y1)
                      lineTo(x2, y2)
                  }

                  val gesture = GestureDescription.Builder()
                      .addStroke(
                          GestureDescription.StrokeDescription(
                              path,
                              0,
                              duracao.coerceIn(150L, 1500L)
                          )
                      )
                      .build()

                  return dispatchGesture(gesture, null, null)
              }

              companion object {
                  @Volatile
                  var instancia: AgenteService? = null
              }
          }
          EOF

          cat > proj/app/src/main/java/com/tomo/agente/MainActivity.kt <<'EOF'
          package com.tomo.agente

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.Executors

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private lateinit var chat: LinearLayout
              private lateinit var entrada: EditText
              private lateinit var tts: TextToSpeech
              private lateinit var statusText: TextView

              private val executor = Executors.newSingleThreadExecutor()

              private val prefs by lazy {
                  getSharedPreferences("agente_v8_memoria", Context.MODE_PRIVATE)
              }

              private val fundo = Color.rgb(8, 13, 32)
              private val branco = Color.rgb(242, 245, 255)
              private val azul = Color.rgb(35, 54, 104)
              private val roxo = Color.rgb(111, 83, 218)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = fundo
                  window.navigationBarColor = fundo

                  tts = TextToSpeech(this, this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(20), dp(18), dp(14))
                      setBackgroundColor(fundo)
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(8), dp(8), dp(8), dp(18))
                  }

                  header.addView(TextView(this).apply {
                      text = "AGENTE V8"
                      textSize = 29f
                      letterSpacing = 0.12f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(164, 153, 255))
                  })

                  header.addView(TextView(this).apply {
                      text = "INTELIGÊNCIA • MEMÓRIA • APRENDIZADO"
                      textSize = 10f
                      letterSpacing = 0.08f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(128, 174, 239))
                  })

                  root.addView(header)

                  val core = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(18), dp(12), dp(18))
                      background = rounded(
                          Color.rgb(17, 25, 55),
                          30,
                          Color.rgb(65, 83, 158)
                      )
                  }

                  val orb = TextView(this).apply {
                      text = "✦"
                      textSize = 54f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(174, 148, 255))
                      background = rounded(
                          Color.rgb(34, 43, 91),
                          100,
                          Color.rgb(112, 112, 238)
                      )
                      elevation = dp(8).toFloat()
                  }

                  val orbParams = LinearLayout.LayoutParams(dp(112), dp(112))
                  orbParams.gravity = Gravity.CENTER
                  core.addView(orb, orbParams)

                  core.addView(TextView(this).apply {
                      text = "NÚCLEO DE INTELIGÊNCIA"
                      textSize = 13f
                      letterSpacing = 0.08f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setTextColor(branco)
                      setPadding(0, dp(15), 0, dp(5))
                  })

                  statusText = TextView(this).apply {
                      text = "●  AGENTE PRONTO"
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(100, 225, 190))
                  }

                  core.addView(statusText)
                  root.addView(core)

                  val memoryPanel = panel("MEMÓRIA E APRENDIZADO").apply {
                      addView(TextView(this@MainActivity).apply {
                          text = "Ensine procedimentos, registre correções e consulte o histórico salvo neste aparelho."
                          textSize = 13f
                          setTextColor(Color.rgb(192, 203, 232))
                      })
                  }

                  val memoryButton = actionButton("🧠  ABRIR MEMÓRIA") {
                      mostrarMemoria()
                  }

                  memoryPanel.addView(memoryButton)
                  root.addView(
                      memoryPanel,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          topMargin = dp(14)
                      }
                  )

                  val chatPanel = panel("CONVERSA COM O AGENTE")

                  chat = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(4), dp(4), dp(4), dp(4))
                  }

                  val chatScroll = ScrollView(this).apply {
                      isFillViewport = false
                      addView(chat)
                  }

                  chatPanel.addView(
                      chatScroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(150)
                      )
                  )

                  root.addView(
                      chatPanel,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      ).apply {
                          topMargin = dp(14)
                      }
                  )

                  entrada = EditText(this).apply {
                      hint = "Escreva ou use o microfone..."
                      setHintTextColor(Color.rgb(135, 147, 181))
                      setTextColor(branco)
                      textSize = 15f
                      setPadding(dp(16), dp(10), dp(16), dp(10))
                      background = rounded(
                          Color.rgb(19, 28, 57),
                          22,
                          Color.rgb(62, 77, 130)
                      )
                  }

                  root.addView(
                      entrada,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply {
                          topMargin = dp(12)
                      }
                  )

                  val sendRow = horizontal()

                  sendRow.addView(
                      actionButton("➤  ENVIAR") {
                          val text = entrada.text.toString().trim()
                          if (text.isNotEmpty()) {
                              entrada.setText("")
                              conversar(text)
                          }
                      },
                      weighted()
                  )

                  sendRow.addView(
                      actionButton("🎙  FALAR") {
                          ouvir()
                      },
                      weighted()
                  )

                  root.addView(sendRow)

                  val toolsRow = horizontal()

                  toolsRow.addView(
                      actionButton("♿ ACESSIBILIDADE") {
                          startActivity(
                              Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                          )
                      },
                      weighted()
                  )

                  toolsRow.addView(
                      actionButton("⚙ CONFIGURAR IA") {
                          configurar()
                      },
                      weighted()
                  )

                  root.addView(toolsRow)

                  val floatingRow = horizontal()

                  floatingRow.addView(
                      actionButton("◉ BOTÃO FLUTUANTE") {
                          botaoFlutuante()
                      },
                      weighted()
                  )

                  floatingRow.addView(
                      actionButton("✧ SEIS ANÁLISES") {
                          Toast.makeText(
                              this,
                              "A análise paralela ainda precisa ser implementada.",
                              Toast.LENGTH_LONG
                          ).show()
                      },
                      weighted()
                  )

                  root.addView(floatingRow)

                  setContentView(root)

                  mensagem(
                      "Agente",
                      "Olá! Configure a chave Gemini para conversar comigo. " +
                          "A memória local já pode guardar o histórico. " +
                          "A análise contínua da tela e as seis análises paralelas " +
                          "ainda não estão implementadas nesta versão."
                  )
              }

              private fun panel(titulo: String): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(13), dp(14), dp(13))
                      background = rounded(
                          Color.rgb(17, 25, 53),
                          25,
                          Color.rgb(48, 64, 112)
                      )

                      addView(TextView(this@MainActivity).apply {
                          text = titulo
                          textSize = 12f
                          letterSpacing = 0.07f
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(Color.rgb(160, 169, 255))
                          setPadding(0, 0, 0, dp(8))
                      })
                  }
              }

              private fun horizontal(): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
              }

              private fun weighted(): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      0,
                      ViewGroup.LayoutParams.WRAP_CONTENT,
                      1f
                  ).apply {
                      setMargins(dp(3), dp(4), dp(3), dp(4))
                  }
              }

              private fun actionButton(
                  label: String,
                  action: () -> Unit
              ): Button {
                  return Button(this).apply {
                      text = label
                      textSize = 11f
                      isAllCaps = false
                      minHeight = dp(48)
                      setTextColor(branco)
                      background = rounded(azul, 22, roxo)
                      setPadding(dp(8), dp(5), dp(8), dp(5))
                      setOnClickListener { action() }
                  }
              }

              private fun rounded(
                  color: Int,
                  radius: Int,
                  stroke: Int
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(color)
                      cornerRadius = dp(radius).toFloat()
                      setStroke(dp(1), stroke)
                  }
              }

              private fun dp(value: Int): Int {
                  return (value * resources.displayMetrics.density).toInt()
              }

              private fun mensagem(autor: String, texto: String) {
                  runOnUiThread {
                      chat.addView(TextView(this).apply {
                          text = "$autor\n$texto"
                          textSize = 14f
                          setTextColor(branco)
                          setPadding(dp(10), dp(8), dp(10), dp(8))
                          background = rounded(
                              Color.rgb(22, 32, 66),
                              18,
                              Color.rgb(43, 57, 103)
                          )
                      })

                      statusText.text = "●  CONVERSA ATUALIZADA"
                      statusText.setTextColor(Color.rgb(118, 190, 255))
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts.language = Locale("pt", "BR")
                  }
              }

              private fun falar(texto: String) {
                  runOnUiThread {
                      tts.speak(
                          texto,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "agente_v8_resposta"
                      )
                  }
              }

              private fun ouvir() {
                  if (
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(
                          arrayOf(Manifest.permission.RECORD_AUDIO),
                          100
                      )
                      return
                  }

                  try {
                      val intent = Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                      ).apply {
                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                          )
                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE,
                              "pt-BR"
                          )
                          putExtra(
                              RecognizerIntent.EXTRA_PROMPT,
                              "Fale com o Agente V8"
                          )
                      }

                      startActivityForResult(intent, 101)
                  } catch (_: Exception) {
                      Toast.makeText(
                          this,
                          "Reconhecimento de voz indisponível.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              @Deprecated("Compatibilidade com reconhecimento de voz")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 101 && resultCode == RESULT_OK) {
                      val text = data
                          ?.getStringArrayListExtra(
                              RecognizerIntent.EXTRA_RESULTS
                          )
                          ?.firstOrNull()

                      if (!text.isNullOrBlank()) {
                          conversar(text)
                      }
                  }
              }

              private fun conversar(texto: String) {
                  mensagem("Você", texto)

                  val key = prefs.getString(
                      "gemini_api_key",
                      ""
                  ).orEmpty()

                  if (key.isBlank()) {
                      mensagem(
                          "Agente",
                          "Configure a chave Gemini para iniciar a conversa."
                      )
                      falar("Configure a chave Gemini primeiro.")
                      return
                  }

                  statusText.text = "●  PROCESSANDO"
                  statusText.setTextColor(Color.rgb(255, 203, 115))

                  executor.execute {
                      try {
                          val memoria = prefs.getString(
                              "historico",
                              ""
                          ).orEmpty()

                          val prompt = """
                              Você é o Agente V8, assistente em português brasileiro.
                              Seja cordial, preciso e honesto sobre suas capacidades.
                              Não afirme que executou uma ação sem confirmação.
                              Ajude o usuário a aprender e a desenvolver o aplicativo.
                              Considere as correções registradas pelo usuário como
                              orientações para conversas futuras.
                              Isso não significa treinamento automático dos pesos
                              do modelo de inteligência artificial.
                              Histórico local:
                              ${memoria.takeLast(7000)}
                              Mensagem atual:
                              $texto
                          """.trimIndent()

                          val resposta = consultarGemini(key, prompt)

                          val novoHistorico =
                              memoria +
                                  "\nUsuário: $texto\nAgente: $resposta"

                          prefs.edit()
                              .putString(
                                  "historico",
                                  novoHistorico.takeLast(12000)
                              )
                              .apply()

                          mensagem("Agente", resposta)
                          falar(resposta)

                          runOnUiThread {
                              statusText.text = "●  RESPOSTA CONCLUÍDA"
                              statusText.setTextColor(
                                  Color.rgb(100, 225, 190)
                              )
                          }
                      } catch (e: Exception) {
                          val erro = "Falha na consulta à IA. Verifique " +
                              "a internet, a chave e o modelo Gemini. " +
                              (e.message ?: "")

                          mensagem("Sistema", erro)

                          runOnUiThread {
                              statusText.text = "●  ERRO NA CONSULTA"
                              statusText.setTextColor(
                                  Color.rgb(255, 115, 135)
                              )
                          }
                      }
                  }
              }

              private fun consultarGemini(
                  key: String,
                  prompt: String
              ): String {
                  val url = URL(
                      "https://generativelanguage.googleapis.com/" +
                          "v1beta/models/gemini-2.5-flash:generateContent" +
                          "?key=" + Uri.encode(key)
                  )

                  val connection = url.openConnection() as HttpURLConnection

                  try {
                      connection.requestMethod = "POST"
                      connection.connectTimeout = 20000
                      connection.readTimeout = 30000
                      connection.doOutput = true

                      connection.setRequestProperty(
                          "Content-Type",
                          "application/json; charset=UTF-8"
                      )

                      val body = JSONObject()
                          .put(
                              "contents",
                              JSONArray().put(
                                  JSONObject().put(
                                      "parts",
                                      JSONArray().put(
                                          JSONObject().put("text", prompt)
                                      )
                                  )
                              )
                          )
                          .toString()

                      connection.outputStream.use {
                          it.write(body.toByteArray(Charsets.UTF_8))
                      }

                      val code = connection.responseCode

                      val stream = if (code in 200..299) {
                          connection.inputStream
                      } else {
                          connection.errorStream
                      }

                      val response = stream.bufferedReader().use {
                          it.readText()
                      }

                      if (code !in 200..299) {
                          throw IllegalStateException(
                              "HTTP $code: ${response.take(250)}"
                          )
                      }

                      return JSONObject(response)
                          .getJSONArray("candidates")
                          .getJSONObject(0)
                          .getJSONObject("content")
                          .getJSONArray("parts")
                          .getJSONObject(0)
                          .getString("text")
                  } finally {
                      connection.disconnect()
                  }
              }

              private fun configurar() {
                  val campo = EditText(this).apply {
                      hint = "Chave da API Gemini"
                      setSingleLine(true)
                      inputType = 129
                      setText(
                          prefs.getString("gemini_api_key", "").orEmpty()
                      )
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Configurar inteligência artificial")
                      .setMessage(
                          "A chave será guardada localmente no aparelho. " +
                              "Não compartilhe sua chave."
                      )
                      .setView(campo)
                      .setPositiveButton("Salvar") { _, _ ->
                          prefs.edit()
                              .putString(
                                  "gemini_api_key",
                                  campo.text.toString().trim()
                              )
                              .apply()

                          Toast.makeText(
                              this,
                              "Configuração salva.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      .setNegativeButton("Cancelar", null)
                      .show()
              }

              private fun mostrarMemoria() {
                  val campo = EditText(this).apply {
                      setText(
                          prefs.getString("historico", "").orEmpty()
                      )
                      setTextColor(Color.BLACK)
                      minLines = 6
                  }

                  AlertDialog.Builder(this)
                      .setTitle("Memória local do Agente")
                      .setMessage(
                          "Edite o histórico ou registre uma orientação " +
                              "para conversas futuras."
                      )
                      .setView(campo)
                      .setPositiveButton("Salvar") { _, _ ->
                          prefs.edit()
                              .putString(
                                  "historico",
                                  campo.text.toString().takeLast(12000)
                              )
                              .apply()

                          Toast.makeText(
                              this,
                              "Memória salva neste aparelho.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      .setNeutralButton("Limpar memória") { _, _ ->
                          prefs.edit()
                              .remove("historico")
                              .apply()

                          Toast.makeText(
                              this,
                              "Histórico apagado.",
                              Toast.LENGTH_SHORT
                          ).show()
                      }
                      .setNegativeButton("Fechar", null)
                      .show()
              }

              private fun botaoFlutuante() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )

                      Toast.makeText(
                          this,
                          "Autorize a sobreposição e toque novamente.",
                          Toast.LENGTH_LONG
                      ).show()

                      return
                  }

                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val bubble = Button(this).apply {
                      text = "✦"
                      textSize = 27f
                      isAllCaps = false
                      setTextColor(Color.WHITE)
                      background = rounded(
                          Color.rgb(86, 65, 194),
                          100,
                          Color.rgb(151, 134, 255)
                      )
                      elevation = dp(8).toFloat()
                  }

                  val params = WindowManager.LayoutParams(
                      dp(62),
                      dp(62),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      android.graphics.PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = dp(16)
                      y = dp(220)
                  }

                  bubble.setOnClickListener {
                      val opcoes = arrayOf(
                          "Abrir Agente V8",
                          "Falar com o Agente",
                          "Fechar botão flutuante"
                      )

                      AlertDialog.Builder(this)
                          .setTitle("AGENTE V8")
                          .setItems(opcoes) { _, escolha ->
                              when (escolha) {
                                  0 -> {
                                      startActivity(
                                          Intent(
                                              this,
                                              MainActivity::class.java
                                          ).addFlags(
                                              Intent.FLAG_ACTIVITY_NEW_TASK
                                          )
                                      )
                                  }

                                  1 -> {
                                      startActivity(
                                          Intent(
                                              this,
                                              MainActivity::class.java
                                          ).addFlags(
                                              Intent.FLAG_ACTIVITY_NEW_TASK
                                          )
                                      )
                                      Toast.makeText(
                                          this,
                                          "Use o botão FALAR na tela do Agente.",
                                          Toast.LENGTH_LONG
                                      ).show()
                                  }

                                  2 -> {
                                      try {
                                          wm.removeView(bubble)
                                      } catch (_: Exception) {
                                      }
                                  }
                              }
                          }
                          .show()
                  }

                  try {
                      wm.addView(bubble, params)

                      Toast.makeText(
                          this,
                          "Botão flutuante criado.",
                          Toast.LENGTH_SHORT
                      ).show()
                  } catch (e: Exception) {
                      Toast.makeText(
                          this,
                          "Não foi possível criar a sobreposição.",
                          Toast.LENGTH_LONG
                      ).show()
                  }
              }

              override fun onDestroy() {
                  if (::tts.isInitialized) {
                      tts.stop()
                      tts.shutdown()
                  }

                  executor.shutdownNow()
                  super.onDestroy()
              }
          }
          EOF

      - name: Compilar APK
        working-directory: proj
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Agente-V8-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
