name: Gerar APK do Tomo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Criar o projeto Android
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          mkdir -p proj/app/src/main/java/com/tomo/app proj/app/src/main/res/values proj/app/src/main/res/drawable proj/app/src/main/res/mipmap-anydpi-v26

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Tomo"
          include ":app"
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tomo.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tomo.app'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Tomo"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="fundo">#2F3E9E</color>
          </resources>
          EOF

          cat > proj/app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="100"
              android:viewportHeight="100">
              <group
                  android:scaleX="0.75"
                  android:scaleY="0.75"
                  android:pivotX="50"
                  android:pivotY="50">
                  <path
                      android:pathData="M62.31,16.17 A36,36 0 1,1 28.21,21.34"
                      android:strokeColor="#FFFFFF"
                      android:strokeWidth="7"
                      android:strokeLineCap="round"
                      android:fillColor="#00000000"/>
                  <path
                      android:fillColor="#E0B565"
                      android:pathData="M40.1,14.4 a4.5,4.5 0 1,0 9,0 a4.5,4.5 0 1,0 -9,0"/>
              </group>
          </vector>
          EOF

          cat > proj/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/fundo"/>
              <foreground android:drawable="@drawable/ic_fg"/>
          </adaptive-icon>
          EOF

          cat > proj/app/src/main/java/com/tomo/app/MainActivity.kt <<'EOF'
          package com.tomo.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.content.Intent
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView

              inner class Ponte {
                  @JavascriptInterface
                  fun falar() {
                      runOnUiThread {
                          val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "pt-BR")
                          try {
                              startActivityForResult(i, 7)
                          } catch (e: Exception) {
                          }
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Ponte(), "Android")
                  web.webChromeClient = WebChromeClient()
                  web.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          view?.evaluateJavascript("(function(){var m=document.getElementById('mic');if(m){m.hidden=false;m.onclick=function(){Android.falar()};}})()", null)
                      }
                  }
                  setContentView(web)
                  web.loadUrl("URL_AQUI")
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 7 && resultCode == RESULT_OK) {
                      val t = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.firstOrNull()
                      if (!t.isNullOrEmpty()) {
                          web.evaluateJavascript("(function(t){var i=document.getElementById('in');i.value=t;document.getElementById('go').click();})(" + JSONObject.quote(t) + ")", null)
                      }
                  }
              }

              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF

          sed -i "s|URL_AQUI|$SITE|" proj/app/src/main/java/com/tomo/app/MainActivity.kt

      - name: Compilar o APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon

      - name: Publicar o APK para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tomo-v${{ github.run_number }}
          name: Tomo v${{ github.run_number }}
          files: proj/app/build/outputs/apk/debug/app-debug.apk
