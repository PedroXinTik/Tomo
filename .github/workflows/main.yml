                  android:text="Ativar Acessibilidade"
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Permitir Overlay"
                  android:layout_marginBottom="12dp"/>

              <Button
                  android:id="@+id/btnVerifier"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Verificador de Imagem"
                  android:layout_marginBottom="12dp"/>

          </LinearLayout>
          EOF

          cat > proj/app/src/main/res/layout/activity_verifier.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
