          cat > proj/app/src/main/java/com/tomo/agente/Image3DVerifier.kt <<'EOF'
          package com.tomo.agente

          import android.graphics.Bitmap
          import android.graphics.Color
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import kotlinx.coroutines.tasks.await
          import kotlin.math.abs
          import kotlin.math.pow
          import kotlin.math.sqrt

          data class Image3DVerificationResult(
              val isGoodFor3D: Boolean,
              val score: Int,
              val reasons: List<String>
          )

          object Image3DVerifier {
              suspend fun verify(bitmap: Bitmap): Image3DVerificationResult {
                  val reasons = mutableListOf<String>()
                  var score = 100

                  if (bitmap.width < 512 || bitmap.height < 512) {
                      reasons.add("Resolução baixa (\( {bitmap.width}x \){bitmap.height}). Mínimo 512x512")
                      score -= 30
                  }

                  val hasFace = detectFace(bitmap)
                  if (!hasFace) {
                      reasons.add("Nenhum rosto detectado")
                      score -= 40
                  }

                  if (calculateSharpness(bitmap) < 70.0) {
                      reasons.add("Imagem desfocada ou com pouca nitidez")
                      score -= 25
                  }

                  score = score.coerceIn(0, 100)
                  val isGood = score >= 65 && hasFace

                  if (isGood && reasons.isEmpty()) reasons.add("Imagem boa para uso")

                  return Image3DVerificationResult(isGood, score, reasons)
              }

              private suspend fun detectFace(bitmap: Bitmap): Boolean {
                  return try {
                      val options = FaceDetectorOptions.Builder()
                          .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_ACCURATE)
                          .build()
                      val detector = FaceDetection.getClient(options)
                      val faces = detector.process(InputImage.fromBitmap(bitmap, 0)).await()
                      faces.isNotEmpty()
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun calculateSharpness(bitmap: Bitmap): Double {
                  var sum = 0.0
                  var sumSq = 0.0
                  var count = 0
                  val step = 3
                  for (y in 1 until bitmap.height - 1 step step) {
                      for (x in 1 until bitmap.width - 1 step step) {
                          val center = getGray(bitmap.getPixel(x, y))
                          val lap = abs(4 * center - getGray(bitmap.getPixel(x-1, y)) - getGray(bitmap.getPixel(x+1, y)) - getGray(bitmap.getPixel(x, y-1)) - getGray(bitmap.getPixel(x, y+1)))
                          sum += lap
                          sumSq += lap * lap
                          count++
                      }
                  }
                  if (count == 0) return 0.0
                  val mean = sum / count
                  return sqrt(((sumSq / count) - mean.pow(2)).coerceAtLeast(0.0))
              }

              private fun getGray(pixel: Int): Int {
                  return (0.299 * Color.red(pixel) + 0.587 * Color.green(pixel) + 0.114 * Color.blue(pixel)).toInt()
              }
          }
          EOF

          cat > proj/app/src/main/java/com/tomo/agente/VerifierActivity.kt <<'EOF'
          package com.tomo.agente

          import android.graphics.BitmapFactory
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Button
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch

          class VerifierActivity : AppCompatActivity() {
              private lateinit var imageView: ImageView
              private lateinit var resultText: TextView

              private val pickImage = registerForActivityResult(ActivityResultContracts.GetContent()) { uri: Uri? ->
                  uri ?: return@registerForActivityResult
                  val bitmap = contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it) } ?: return@registerForActivityResult
                  imageView.setImageBitmap(bitmap)

                  lifecycleScope.launch {
                      resultText.text = "Analisando..."
                      val result = Image3DVerifier.verify(bitmap)
                      val status = if (result.isGoodFor3D) "✅ BOA PARA USO" else "❌ NÃO RECOMENDADA"
                      resultText.text = buildString {
                          appendLine(status)
                          appendLine("Nota: ${result.score}/100\n")
                          result.reasons.forEach { appendLine("• $it") }
                      }
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_verifier)
                  imageView = findViewById(R.id.imageView)
                  resultText = findViewById(R.id.resultText)
                  findViewById<Button>(R.id.btnSelect).setOnClickListener { pickImage.launch("image/*") }
              }
          }
          EOF

