<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tomo</title>
<style>
:root{--bg:#EEF1F8;--surface:#fff;--ink:#141B34;--muted:#5B6485;--accent:#2F3E9E;--on:#fff;--line:#D5DAEA}
@media (prefers-color-scheme:dark){:root{--bg:#0E1328;--surface:#192140;--ink:#E8EBF7;--muted:#98A1C4;--accent:#8E9CFF;--on:#0E1328;--line:#2A3566}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
header b{flex:1;font-size:22px}
button{font:inherit;cursor:pointer}
.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;min-height:40px;padding:0 12px}
#cfg{padding:12px 16px;border-bottom:1px solid var(--line);display:grid;gap:8px}
#cfg input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
#cfg small{color:var(--muted)}
#list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:86%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:var(--accent);color:var(--on)}
.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line)}
.n{align-self:center;text-align:center;color:var(--muted);font-size:14px}
.v{margin:auto;text-align:center;color:var(--muted)}
.c{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);padding:12px 16px;font:inherit;font-size:16px}
.r{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--on);font-size:20px}
.r.on{outline:3px solid #d33}
</style>
</head>
<body>
<div class="app">
  <header>
    <b>Tomo</b>
    <button class="g" id="bv" type="button">🔊</button>
    <button class="g" id="bc" type="button">⚙</button>
    <button class="g" id="bn" type="button">Nova</button>
  </header>
  <div id="cfg" hidden>
    <input id="key" type="password" placeholder="Cole sua chave do Gemini aqui" autocomplete="off">
    <input id="model" type="text" placeholder="Modelo">
    <button class="g" id="bs" type="button">Salvar</button>
    <small>A chave fica só neste celular. Se der erro 404, troque o modelo por gemini-2.5-flash-lite.</small>
  </div>
  <main id="list"></main>
  <div class="c">
    <textarea id="in" rows="1" placeholder="Escreva ou toque no microfone"></textarea>
    <button class="r" id="mic" type="button" aria-label="Falar">🎤</button>
    <button class="r" id="go" type="button" aria-label="Enviar">➤</button>
  </div>
</div>
<script>
var SYS="Você é o Tomo, um assistente de IA em um app de celular. Responda em português do Brasil, de forma curta, clara e amigável, em texto simples.";
var $=function(s){return document.querySelector(s)};
function lg(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var msgs=[];try{msgs=JSON.parse(lg("tomo:msgs")||"[]")}catch(e){msgs=[]}
var busy=false,nota="",voz=lg("tomo:voz")==="1";
$("#key").value=lg("tomo:key")||"";
$("#model").value=lg("tomo:model")||"gemini-flash-lite-latest";
if(!lg("tomo:key"))$("#cfg").hidden=false;
$("#bv").style.opacity=voz?1:.5;

function render(extra){
  var l=$("#list");l.textContent="";
  if(!msgs.length){var v=document.createElement("div");v.className="v";v.textContent="Oi! Toque no microfone e fale comigo.";l.appendChild(v)}
  msgs.forEach(function(m){var d=document.createElement("div");d.className="m "+(m.role==="user"?"u":"a");d.textContent=m.text;l.appendChild(d)});
  if(extra){var p=document.createElement("div");p.className="n";p.textContent=extra;l.appendChild(p)}
  if(nota){var n=document.createElement("div");n.className="n";n.textContent=nota;l.appendChild(n)}
  l.scrollTop=l.scrollHeight;
}
function falar(t){
  if(!voz||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";speechSynthesis.speak(u);
}
async function enviar(texto){
  texto=(texto||"").trim();if(!texto||busy)return;
  var key=lg("tomo:key"),model=lg("tomo:model")||"gemini-flash-lite-latest";
  nota="";
  if(!key){nota="Cole sua chave do Gemini em ⚙ primeiro.";$("#cfg").hidden=false;render();return}
  msgs.push({role:"user",text:texto});$("#in").value="";busy=true;render("pensando...");
  try{
    var cont=msgs.slice(-20).map(function(m){return{role:m.role==="user"?"user":"model",parts:[{text:m.text}]}});
    while(cont.length&&cont[0].role==="model")cont.shift();
    var r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({systemInstruction:{parts:[{text:SYS}]},contents:cont})
    });
    var j=await r.json();
    if(!r.ok)throw new Error((j.error&&j.error.message)||("Erro "+r.status));
    var t="(sem resposta)";
    if(j.candidates&&j.candidates[0]&&j.candidates[0].content){t=j.candidates[0].content.parts.map(function(p){return p.text||""}).join("")}
    msgs.push({role:"model",text:t});falar(t);
  }catch(e){
    msgs.pop();$("#in").value=texto;nota="Não deu certo: "+e.message;
  }
  busy=false;ls("tomo:msgs",JSON.stringify(msgs.slice(-40)));render();
}
$("#go").onclick=function(){enviar($("#in").value)};
$("#in").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,140)+"px"});
$("#bc").onclick=function(){$("#cfg").hidden=!$("#cfg").hidden};
$("#bs").onclick=function(){ls("tomo:key",$("#key").value.trim());ls("tomo:model",$("#model").value.trim());$("#cfg").hidden=true;nota="Salvo.";render()};
$("#bn").onclick=function(){msgs=[];nota="";ls("tomo:msgs","[]");render()};
$("#bv").onclick=function(){voz=!voz;ls("tomo:voz",voz?"1":"0");this.style.opacity=voz?1:.5;if(!voz&&window.speechSynthesis)speechSynthesis.cancel()};

var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,ouvindo=false;
if(!SR)$("#mic").hidden=true;
$("#mic").onclick=function(){
  if(ouvindo){if(rec)rec.stop();return}
  rec=new SR();rec.lang="pt-BR";rec.interimResults=false;rec.continuous=false;
  rec.onstart=function(){ouvindo=true;$("#mic").classList.add("on")};
  rec.onend=function(){ouvindo=false;$("#mic").classList.remove("on")};
  rec.onerror=function(e){nota="Microfone: "+e.error;render()};
  rec.onresult=function(e){enviar(e.results[0][0].transcript)};
  rec.start();
};
render();
</script>
</body>
</html>
